<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revisão de Plano de Saúde - Scozziero Advocacia</title>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #F0F4F8;
      color: #333;
    }

    header {
      background: linear-gradient(135deg, #1B3A5C, #0d2440);
      color: white;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    header p {
      font-size: 12px;
      opacity: 0.9;
    }

    .container {
      max-width: 1400px;
      margin: 20px auto;
      padding: 0 20px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid #ddd;
      flex-wrap: wrap;
    }

    .tab-button {
      padding: 12px 20px;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: #666;
      transition: all 0.3s ease;
    }

    .tab-button.active {
      color: #1B3A5C;
      border-bottom-color: #C8A96E;
    }

    .tab-button:hover {
      color: #1B3A5C;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .kpi-card {
      background: white;
      border-left: 4px solid;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      animation: slideIn 0.4s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .kpi-card.green {
      border-left-color: #27AE60;
    }

    .kpi-card.orange {
      border-left-color: #F39C12;
    }

    .kpi-card.blue {
      border-left-color: #3498DB;
    }

    .kpi-card.purple {
      border-left-color: #9B59B6;
    }

    .kpi-card.gray {
      border-left-color: #95A5A6;
    }

    .kpi-label {
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .kpi-value {
      font-size: 24px;
      font-weight: bold;
      color: #1B3A5C;
    }

    /* R$ sempre em linha acima do valor — uniformiza leitura de KPIs e tabela consolidada. */
    .brl-stack { display: inline-flex; flex-direction: column; line-height: 1.1; align-items: flex-start; vertical-align: middle; }
    .brl-stack-cifra { font-size: 0.6em; font-weight: 500; color: #64748B; letter-spacing: 0.5px; }
    .brl-stack-valor { font-weight: inherit; }
    td.text-right .brl-stack { align-items: flex-end; }

    .kpi-icon {
      font-size: 28px;
      margin-bottom: 8px;
    }

    /* Capa do Caso — cabeçalho institucional (fundo off-white, mais leve, mantém identidade via faixas) */
    .capa-caso {
      background: #FAFBFC;
      color: #1B3A5C;
      padding: 28px 32px;
      border-radius: 10px;
      margin-bottom: 22px;
      box-shadow: 0 1px 4px rgba(27, 58, 92, 0.08);
      border: 1px solid #E2E8F0;
      border-top: 3px solid #1B3A5C;
      border-left: 6px solid #C8A96E;
    }
    .capa-caso .capa-topo {
      display: flex; justify-content: space-between; align-items: flex-start;
      border-bottom: 1px solid #E2E8F0;
      padding-bottom: 14px; margin-bottom: 16px; gap: 20px; flex-wrap: wrap;
    }
    .capa-caso h2 {
      margin: 0 0 4px 0; font-size: 22px; color: #1B3A5C; font-weight: 700;
    }
    .capa-caso .capa-sub { font-size: 13px; color: #8B6914; letter-spacing: 0.5px; font-weight: 600; }
    .capa-caso .capa-escritorio { text-align: right; font-size: 12px; line-height: 1.4; color: #475569; }
    .capa-caso .capa-escritorio strong { font-size: 14px; color: #8B6914; display: block; }
    .capa-caso .capa-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px 28px;
    }
    .capa-caso .capa-item {
      display: flex; flex-direction: column; gap: 2px;
    }
    .capa-caso .capa-item .rotulo {
      font-size: 10.5px; text-transform: uppercase; color: #64748B; letter-spacing: 0.8px; font-weight: 600;
    }
    .capa-caso .capa-item .valor { font-size: 14px; color: #1B3A5C; font-weight: 600; word-break: break-word; }
    .capa-caso .capa-item .valor.destaque { font-size: 16px; color: #8B6914; }

    .section {
      background: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    .section h2 {
      color: #1B3A5C;
      margin-bottom: 15px;
      font-size: 18px;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #555;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 13px;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #C8A96E;
      background: #FFFEF5;
    }

    button {
      padding: 10px 20px;
      background: #1B3A5C;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #0d2440;
    }

    button.secondary {
      background: #95A5A6;
    }

    button.secondary:hover {
      background: #7F8C8D;
    }

    button.danger {
      background: #E74C3C;
    }

    button.danger:hover {
      background: #C0392B;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .table thead {
      background: #F8F9FA;
      position: sticky;
      top: 0;
    }

    .table th {
      padding: 12px;
      text-align: left;
      font-weight: 600;
      color: #1B3A5C;
      border-bottom: 2px solid #ddd;
    }

    .table td {
      padding: 12px;
      border-bottom: 1px solid #eee;
    }

    .table tbody tr:nth-child(even) {
      background: #F8F9FA;
    }

    .table tbody tr:hover {
      background: #E8EAED;
    }

    /* Tabela com agrupamento por ano — desliga zebra striping para que o backgroundColor inline (definido por ano) seja a cor dominante. */
    .table-ano tbody tr:nth-child(even) { background: inherit; }
    .table-ano tbody tr:hover { filter: brightness(0.97); }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge.excesso {
      background: #FADBD8;
      color: #C0392B;
    }

    .badge.prescrito {
      background: #D5DBDB;
      color: #566573;
    }

    .badge.ok {
      background: #D5F4E6;
      color: #27AE60;
    }

    .config-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .sub-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      border-bottom: 1px solid #ddd;
    }

    .sub-tab-button {
      padding: 10px 15px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: #666;
      transition: all 0.3s ease;
    }

    .sub-tab-button.active {
      color: #1B3A5C;
      border-bottom-color: #C8A96E;
    }

    .sub-tab-content {
      display: none;
    }

    .sub-tab-content.active {
      display: block;
    }

    .info-text {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .text-right {
      text-align: right;
    }

    .text-center {
      text-align: center;
    }

    @media (max-width: 1024px) {
      .kpi-grid {
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      }
    }

    /* ── Modais (Link Mágico, Desbloqueio, Seletor de Caso) ───────────── */
    .lm-overlay {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.78);
      z-index: 9998; display: flex; align-items: center; justify-content: center;
      padding: 20px; backdrop-filter: blur(4px);
    }
    .lm-dialog {
      background: white; border-radius: 12px; max-width: 560px; width: 100%;
      max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      animation: lmFade 0.2s ease-out;
    }
    @keyframes lmFade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .lm-dialog .lm-header {
      background: linear-gradient(135deg, #1B3A5C 0%, #2C5282 100%); color: white;
      padding: 20px 24px; border-radius: 12px 12px 0 0;
    }
    .lm-dialog .lm-header h2 { margin: 0 0 4px 0; font-size: 20px; font-weight: 700; }
    .lm-dialog .lm-header p { margin: 0; font-size: 13px; opacity: 0.9; }
    .lm-dialog .lm-body { padding: 24px; }
    .lm-dialog .lm-field { margin-bottom: 14px; }
    .lm-dialog .lm-field label { display: block; font-size: 13px; font-weight: 600; color: #1B3A5C; margin-bottom: 4px; }
    .lm-dialog .lm-field input {
      width: 100%; padding: 10px 12px; border: 1px solid #CBD5E1; border-radius: 6px;
      font-size: 15px; box-sizing: border-box; font-family: inherit;
    }
    .lm-dialog .lm-field input:focus { outline: none; border-color: #1B3A5C; box-shadow: 0 0 0 3px rgba(27,58,92,0.15); }
    .lm-dialog .lm-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
    .lm-dialog .lm-btn {
      padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px;
    }
    .lm-dialog .lm-btn.primary { background: #1B3A5C; color: white; }
    .lm-dialog .lm-btn.primary:hover { background: #2C5282; }
    .lm-dialog .lm-btn.secondary { background: #E2E8F0; color: #1B3A5C; }
    .lm-dialog .lm-btn.secondary:hover { background: #CBD5E1; }
    .lm-dialog .lm-btn.gold { background: #C8A96E; color: #1B3A5C; }
    .lm-dialog .lm-btn.gold:hover { background: #B89559; }
    .lm-dialog .lm-btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .lm-dialog .lm-error { color: #B91C1C; font-size: 13px; margin-top: 8px; background: #FEE2E2; padding: 8px 12px; border-radius: 6px; }
    .lm-dialog .lm-ok    { color: #065F46; font-size: 13px; margin-top: 8px; background: #D1FAE5; padding: 8px 12px; border-radius: 6px; }
    .lm-dialog .lm-note  { color: #475569; font-size: 13px; line-height: 1.5; background: #F1F5F9; padding: 10px 12px; border-radius: 6px; margin-bottom: 14px; }
    .lm-dialog .lm-link-output {
      background: #F8FAFC; border: 1px solid #CBD5E1; border-radius: 6px; padding: 10px;
      font-family: 'Courier New', monospace; font-size: 11px; word-break: break-all; margin-top: 8px; max-height: 120px; overflow-y: auto;
    }
    .lm-caso-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; border: 1px solid #E2E8F0; border-radius: 8px; margin-bottom: 8px;
      background: white; transition: all 0.15s;
    }
    .lm-caso-item:hover { border-color: #1B3A5C; background: #F8FAFC; }
    .lm-caso-item .nome { font-weight: 600; color: #1B3A5C; }
    .lm-caso-item .meta { font-size: 11px; color: #64748B; }

    /* Elementos só visíveis na impressão */
    .print-only { display: none; }

    /* Ajustes para impressão (Dashboard e Relatório por Segurado) */
    @media print {
      body { background: white !important; color: #000 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      header, .tabs, .sub-tabs, .no-print { display: none !important; }
      button { display: none !important; }
      .tab-content { display: block !important; animation: none !important; }
      /* .section NÃO tem page-break-inside para permitir fluxo natural (evita quebra prematura entre Parâmetros e Demonstrativo) */
      .section {
        box-shadow: none !important;
        border: 1px solid #ccc !important;
        margin-bottom: 10px;
      }
      /* KPI cards e grid permanecem inquebráveis */
      .kpi-card {
        box-shadow: none !important;
        border: 1px solid #ccc !important;
        break-inside: avoid;
        page-break-inside: avoid;
        margin-bottom: 10px;
      }
      .kpi-grid { page-break-inside: avoid; break-inside: avoid; }
      /* Linhas da tabela do demonstrativo não devem quebrar no meio */
      table.table tr { page-break-inside: avoid; break-inside: avoid; }
      table.table thead { display: table-header-group; }
      .print-only { display: block !important; }
      .print-header {
        text-align: center;
        margin-bottom: 18px;
        border-bottom: 2px solid #1B3A5C;
        padding-bottom: 8px;
      }
      .print-header h1 { color: #1B3A5C; font-size: 20px; margin-bottom: 4px; }
      .print-header p { font-size: 11px; color: #555; margin: 0; }
      table.table { font-size: 10.5px; }
      table.table th, table.table td { padding: 5px 6px; }
      .container { max-width: 100%; margin: 0; padding: 0; }
      .kpi-icon { display: none; }
      .kpi-value { font-size: 18px !important; }
      .kpi-label { font-size: 11px; }
      .kpi-grid { grid-template-columns: repeat(5, 1fr) !important; gap: 6px; }
      .page-break { page-break-after: always; }
      /* Impressão completa (Dashboard + todos os relatórios) */
      #print-all-doc { display: none; }
      @media print {
        body.printing-all > #root > div > *:not(#print-all-doc) { display: none !important; }
        body.printing-all #print-all-doc { display: block !important; }
      }
      /* Numeração de páginas no rodapé (Chromium/Edge/Firefox) */
      @page {
        margin: 1.5cm 1.5cm 2cm 1.5cm;
        size: A4;
        @bottom-right {
          content: "Página " counter(page) " de " counter(pages);
          font-family: 'Segoe UI', Arial, sans-serif;
          font-size: 10px;
          color: #555;
        }

      }
      /* Capa institucional — fundo claro com acentos azul e dourado para economizar tinta sem perder identidade */
      .capa-caso {
        background: #FAFBFC !important;
        color: #1B3A5C !important;
        box-shadow: none !important;
        border: 1px solid #CBD5E1 !important;
        border-top: 3px solid #1B3A5C !important;
        border-left: 6px solid #C8A96E !important;
        page-break-inside: avoid;
        break-inside: avoid;
      }
      .capa-caso h2, .capa-caso .capa-item .valor { color: #1B3A5C !important; }
      .capa-caso .capa-sub, .capa-caso .capa-item .valor.destaque, .capa-caso .capa-escritorio strong { color: #8B6914 !important; }
      .capa-caso .capa-item .rotulo { color: #475569 !important; }
      .capa-caso .capa-topo { border-bottom-color: #CBD5E1 !important; }
    }
  </style>
</head>

  <div id="root"></div>

const _MESES_ABR = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function fmtMesAno(mesAno) {

// ── Crypto helpers para Link Mágico (AES-GCM + PBKDF2) ──────────────────────
// Cifra o token do GitHub com um PIN do usuário. Permite distribuir um URL com
// o token embutido no hash fragment (que não vai ao servidor do GitHub Pages).
function _b64urlEnc(buf) {
  const bytes = new Uint8Array(buf);
  let s = '';
  for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function _b64urlDec(str) {
  str = str.replace(/-/g,'+').replace(/_/g,'/');
  while (str.length % 4) str += '=';
  const bin = atob(str);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}
async function _deriveKey(pin, salt) {
  const keyMaterial = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' },
    keyMaterial,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
}
async function encryptWithPin(plaintext, pin) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv   = crypto.getRandomValues(new Uint8Array(12));
  const key  = await _deriveKey(pin, salt);
  const ct   = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(plaintext));
  const packed = new Uint8Array(1 + salt.length + iv.length + ct.byteLength);
  packed[0] = 1; // versão
  packed.set(salt, 1);
  packed.set(iv, 1 + salt.length);
  packed.set(new Uint8Array(ct), 1 + salt.length + iv.length);
  return _b64urlEnc(packed);
}
async function decryptWithPin(encoded, pin) {
  const packed = _b64urlDec(encoded);
  if (packed[0] !== 1) throw new Error('Versão de link não suportada');
  const salt = packed.slice(1, 17);
  const iv   = packed.slice(17, 29);
  const ct   = packed.slice(29);
  const key  = await _deriveKey(pin, salt);
  const pt   = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
  return new TextDecoder().decode(pt);
}

// Aceita apenas o layout Guilherme - ferramenta_inteligente_de_revisao_de_plano_de_saude_fn.xlsx
// Abas lidas: Segurado1-7. Aba é considerada vazia se C2 (nome do beneficiário) estiver em branco.
// CNPJ e Empresa não existem na planilha — ficam em branco, usuário completa depois.
function _xlsxCell(ws, ref) { const c = ws && ws[ref]; return c ? c.v : null; }
function _xlsxDateToYm(v) {
  if (!v) return null;
  if (v instanceof Date) { const y = v.getFullYear(); const m = String(v.getMonth()+1).padStart(2,'0'); return y + '-' + m; }
  if (typeof v === 'string' && /^\d{4}-\d{2}/.test(v)) return v.slice(0,7);
  return null;
}
function _xlsxDateToYmd(v) {
  if (!v) return '';
  if (v instanceof Date) { const y = v.getFullYear(); const m = String(v.getMonth()+1).padStart(2,'0'); const d = String(v.getDate()).padStart(2,'0'); return y + '-' + m + '-' + d; }

function _xlsxMapIndexador(raw) {

  if (s.indexOf('INPC') === 0) return 'ia';
  if (s.indexOf('FIPE') === 0) return 'fa';

function _xlsxNum(v) {

function parseXlsxToPayload(workbook, nomeCaso) {
  const SHEETS = ['Segurado1','Segurado2','Segurado3','Segurado4','Segurado5','Segurado6','Segurado7'];
  const beneficiarios = [];
  const reajustes = [];
  const reajustesSuspeitos = [];
  let operadora = '', nrContrato = '';
  let configIndexador = 'ca', configMesReajuste = 12;
  let configDataInicio = '', configDataFim = '';
  const baseId = Date.now();
  const cnpjId = baseId;
  let idx = 0;
  const abasLidas = [], abasPuladas = [];

  for (const sheetName of SHEETS) {
    const ws = workbook.Sheets[sheetName];
    if (!ws) { abasPuladas.push(sheetName + ' (inexistente)'); continue; }
    const nome = _xlsxCell(ws, 'C2');
    if (!nome || String(nome).trim() === '') { abasPuladas.push(sheetName + ' (vazia)'); continue; }

    if (!operadora)  operadora  = String(_xlsxCell(ws, 'C3') || '').trim();
    if (!nrContrato) nrContrato = String(_xlsxCell(ws, 'C4') || '').trim();
    const mesReaj = _xlsxCell(ws, 'C6');
    if (typeof mesReaj === 'number' && mesReaj >= 1 && mesReaj <= 12) configMesReajuste = mesReaj;
    const idxRaw = _xlsxCell(ws, 'J6');
    if (idxRaw) configIndexador = _xlsxMapIndexador(idxRaw);
    const dIni = _xlsxDateToYmd(_xlsxCell(ws, 'J2') || _xlsxCell(ws, 'C5'));
    const dFim = _xlsxDateToYm(_xlsxCell(ws, 'E5'));
    if (dIni && !configDataInicio) configDataInicio = dIni;
    if (dFim && !configDataFim)    configDataFim    = dFim;

    idx++;
    const benId = baseId + idx;
    beneficiarios.push({
      id: benId,
      cnpjId: String(cnpjId),
      nome: String(nome).trim(),
      cpf: '',
      dataNascimento: '',
      dataAdesao: '',
      numeroCarteirinha: ''
    });

    let ridx = 0;
    let valorAnterior = null;
    // Planilha guarda porcentagens como decimal (0.19 = 19%). O motor espera % inteiro (19).
    const _toPct = (n) => isNaN(n) ? '' : String(Math.round(n * 100 * 1e6) / 1e6);
    for (let r = 12; r <= 10000; r++) {
      const a = _xlsxCell(ws, 'A'+r);
      if (a === null || a === undefined || a === '') break;
      const mesAno = _xlsxDateToYm(a);
      if (!mesAno) break;
      const b = _xlsxNum(_xlsxCell(ws, 'B'+r));
      if (isNaN(b)) continue;
      const c = _xlsxNum(_xlsxCell(ws, 'C'+r));
      const e = _xlsxNum(_xlsxCell(ws, 'E'+r));
      const f = _xlsxNum(_xlsxCell(ws, 'F'+r));

      // Sugestão: reajuste = B[r]/B[r-1] - 1, descontando mudança de idade (F) quando presente.
      let observacao = '';

        const fatorIdade = isNaN(f) ? 1 : (1 + f);
        const sugerido = (b / valorAnterior) / fatorIdade - 1;
        if (Math.abs(sugerido) > 0.001) {
          const pctSug = Math.round(sugerido * 100 * 1e6) / 1e6;
          reajustesSuspeitos.push({
            beneficiario: String(nome).trim(),
            mesAno: mesAno,
            valorAnterior: valorAnterior,
            valorNovo: b,
            sugestaoPct: pctSug

        id: baseId * 1000 + idx * 100000 + ridx,
        beneficiarioId: String(benId),
        mesAno: mesAno,
        valorPago: String(b),
        reajusteAplicado: _toPct(c),
        reajusteNegativo: _toPct(e),
        mudancaIdade:     _toPct(f),
        observacao: observacao

    }

  }

    throw new Error('Nenhum segurado encontrado na planilha. Verifique se o nome está preenchido em C2 de alguma aba Segurado1-7.');
  }

  return {
    _info: { abasLidas: abasLidas, abasPuladas: abasPuladas, reajustesSuspeitos: reajustesSuspeitos },
    metadados: {
      nome: nomeCaso || 'Import_XLSX_' + new Date().toISOString().slice(0,19).replace(/[:T]/g,'-'),
      salvoEm: new Date().toISOString(),
      versao: '1.0',
      origem: 'Importação automática de planilha XLSX padrão do escritório'
    },
    cnpjs: [{
      id: cnpjId,
      cnpj: '',
      empresa: '',
      operadora: operadora,
      nrContrato: nrContrato
    }],
    beneficiarios: beneficiarios,
    reajustes: reajustes,
    config: {
      indexador: configIndexador,
      juros: 'hybrid',
      refMes: 'baseplanilha',
      dataFim: configDataFim || '2026-02',
      dataInicio: configDataInicio || '',
      mesReajuste: configMesReajuste
    }
  };
}

  const [ghToken, setGhToken] = React.useState(() => ls('ghToken', ''));
  const [ghStatus, setGhStatus] = React.useState('');
  const [ghSaving, setGhSaving] = React.useState(false);
  const [ghLoading, setGhLoading] = React.useState(false);
  const [ghCasoNome, setGhCasoNome] = React.useState(() => ls('ghCasoNome', ''));
  React.useEffect(() => { try { localStorage.setItem('calc_ghToken', JSON.stringify(ghToken)); } catch(e) {} }, [ghToken]);
  React.useEffect(() => { try { localStorage.setItem('calc_ghCasoNome', JSON.stringify(ghCasoNome)); } catch(e) {} }, [ghCasoNome]);
  const [ghCasos, setGhCasos] = React.useState([]);
  const [ghHistorico, setGhHistorico] = React.useState(null);

  // ── Link Mágico + Seletor de Caso (multi-dispositivo) ────────────────────
  const [bootModal, setBootModal] = React.useState(null); // 'unlock' | 'select' | 'setup' | null
  const [bootError, setBootError] = React.useState('');
  const [unlockPin, setUnlockPin] = React.useState('');
  const [unlockBusy, setUnlockBusy] = React.useState(false);
  const [linkGenOpen, setLinkGenOpen] = React.useState(false);
  const [linkPin1, setLinkPin1] = React.useState('');
  const [linkPin2, setLinkPin2] = React.useState('');
  const [linkGenResult, setLinkGenResult] = React.useState('');
  const [linkGenError, setLinkGenError] = React.useState('');
  const [linkCopyStatus, setLinkCopyStatus] = React.useState('');
  const bootRanRef = React.useRef(false);

  // GitHub helper functions
  const toBase64 = (str) => btoa(unescape(encodeURIComponent(str)));
  const ghHdrs = () => ({ 'Authorization': `token ${ghToken}`, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github.v3+json' });

  const ghListCasos = async () => {
    if (!ghToken) { setGhStatus('❌ Informe o token GitHub primeiro'); return; }
    setGhLoading(true); setGhStatus('🔍 Buscando casos...');
    try {
      const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/casos`, { headers: ghHdrs() });
      if (res.status === 404) { setGhCasos([]); setGhStatus('📂 Nenhum caso salvo ainda'); }
      else if (res.ok) {
        const files = await res.json();
        const arr = Array.isArray(files) ? files.filter(f => f.name.endsWith('.json')) : [];
        setGhCasos(arr);
        setGhStatus(`✅ ${arr.length} caso(s) encontrado(s)`);
      } else { const e = await res.json(); setGhStatus(`❌ ${e.message}`); }
    } catch(e) { setGhStatus(`❌ Erro de rede: ${e.message}`); }
    setGhLoading(false);
  };

  const ghSalvar = async () => {
    if (!ghToken) { setGhStatus('❌ Informe o token GitHub'); return; }
    if (!ghCasoNome.trim()) { setGhStatus('❌ Informe um nome para o caso'); return; }
    setGhSaving(true); setGhStatus('💾 Salvando...');
    const nome = ghCasoNome.trim().replace(/[^\w\s\-]/g, '').replace(/\s+/g, '_');
    const path = `casos/${nome}.json`;
    const payload = {
      metadados: { nome: ghCasoNome.trim(), salvoEm: new Date().toISOString(), versao: '1.0' },
      cnpjs, beneficiarios, reajustes,
      config: { indexador: configIndexador, juros: configJuros, refMes: configRefMes, dataFim: configDataFim, dataInicio: configDataInicio, dataAjuizamento: configDataAjuizamento, mesReajuste: configMesReajuste, escritorio: configEscritorio }
    };
    try {
      const checkRes = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${path}`, { headers: ghHdrs() });
      const body = { message: `Salvo: ${ghCasoNome} — ${new Date().toLocaleString('pt-BR')}`, content: toBase64(JSON.stringify(payload, null, 2)) };
      if (checkRes.ok) { const ex = await checkRes.json(); body.sha = ex.sha; }
      const saveRes = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${path}`, { method: 'PUT', headers: ghHdrs(), body: JSON.stringify(body) });
      if (saveRes.ok) { setGhStatus(`✅ Salvo com sucesso: "${ghCasoNome}"`); ghListCasos(); }
      else { const e = await saveRes.json(); setGhStatus(`❌ Erro ao salvar: ${e.message}`); }
    } catch(e) { setGhStatus(`❌ ${e.message}`); }
    setGhSaving(false);
  };

  const ghCarregar = async (file) => {
    if (!window.confirm(`Carregar o caso "${file.name.replace('.json','')}"? Os dados atuais serão substituídos.`)) return;
    setGhLoading(true); setGhStatus(`📂 Carregando...`);
    try {
      const res = await fetch(file.download_url + '?t=' + Date.now());
      if (res.ok) {
        const data = await res.json();
        setCnpjs(data.cnpjs || []); setBeneficiarios(data.beneficiarios || []); setReajustes(data.reajustes || []);
        if (data.config) { setConfigIndexador(data.config.indexador||'ca'); setConfigJuros(data.config.juros||'hybrid'); setConfigRefMes(data.config.refMes||'baseplanilha'); setConfigDataFim(data.config.dataFim||'2026-02'); setConfigDataInicio(data.config.dataInicio||'2000-01-01'); setConfigDataAjuizamento(data.config.dataAjuizamento || ''); setConfigMesReajuste(data.config.mesReajuste || 12); setConfigEscritorio(data.config.escritorio || 'Scozziero Advocacia'); }
        setGhCasoNome(data.metadados?.nome || file.name.replace('.json',''));
        setGhStatus(`✅ Caso carregado: "${data.metadados?.nome || file.name}"`);
        setActiveTab('dashboard');
      } else { setGhStatus('❌ Erro ao carregar o arquivo'); }
    } catch(e) { setGhStatus(`❌ ${e.message}`); }
    setGhLoading(false);
  };

  const ghRenomear = async (file) => {
    const nomeAtualExibido = file.name.replace('.json','').replace(/_/g,' ');
    const nomeAtualSafe = file.name.replace('.json','');
    const entrada = window.prompt(`Renomear caso "${nomeAtualExibido}" para:`, nomeAtualExibido);
    if (entrada === null) return;
    const novoNome = entrada.trim();
    if (!novoNome) { setGhStatus('❌ Nome do caso não pode ficar vazio'); return; }
    if (novoNome === nomeAtualExibido) { setGhStatus('⚠️ O nome não foi alterado'); return; }
    const novoSafe = novoNome.replace(/[^\w\s\-]/g, '').replace(/\s+/g, '_');
    if (!novoSafe) { setGhStatus('❌ O nome informado ficou vazio após sanitização (remova caracteres especiais)'); return; }
    if (novoSafe === nomeAtualSafe) { setGhStatus('⚠️ O nome normalizado é igual ao atual'); return; }
    const colisao = ghCasos.find(c => c.name === `${novoSafe}.json` && c.sha !== file.sha);
    if (colisao) { setGhStatus(`❌ Já existe um caso salvo com o nome "${novoNome}"`); return; }
    if (!window.confirm(`Renomear "${nomeAtualExibido}" → "${novoNome}"?\n\nO arquivo antigo será removido do repositório. O histórico de versões do arquivo antigo permanece acessível via GitHub, mas não será mais listado aqui.`)) return;
    if (autoSaveTimer.current) clearTimeout(autoSaveTimer.current);
    setGhLoading(true); setGhStatus('✏️ Renomeando...');
    const novoPath = `casos/${novoSafe}.json`;
    try {
      const resGet = await fetch(file.download_url + '?t=' + Date.now());
      if (!resGet.ok) throw new Error('Falha ao baixar o caso atual');
      const data = await resGet.json();
      if (data.metadados) data.metadados.nome = novoNome;
      else data.metadados = { nome: novoNome, salvoEm: new Date().toISOString(), versao: '1.0' };
      const bodyCreate = { message: `Renomeado: "${nomeAtualExibido}" → "${novoNome}"`, content: toBase64(JSON.stringify(data, null, 2)) };
      const createRes = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${novoPath}`, { method: 'PUT', headers: ghHdrs(), body: JSON.stringify(bodyCreate) });
      if (!createRes.ok) { const e = await createRes.json(); throw new Error(`Falha ao criar novo arquivo: ${e.message}`); }
      const bodyDel = { message: `Remove arquivo antigo após renomear para "${novoNome}"`, sha: file.sha };
      const delRes = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${file.path}`, { method: 'DELETE', headers: ghHdrs(), body: JSON.stringify(bodyDel) });
      if (!delRes.ok) { const e = await delRes.json(); setGhStatus(`⚠️ Novo caso criado, mas falhou ao excluir o antigo: ${e.message}. Remova manualmente pelo GitHub se quiser.`); ghListCasos(); setGhLoading(false); return; }
      if (ghCasoNome === nomeAtualExibido || ghCasoNome === nomeAtualSafe.replace(/_/g,' ')) setGhCasoNome(novoNome);
      setGhStatus(`✅ Caso renomeado para "${novoNome}"`);
      ghListCasos();
    } catch(e) { setGhStatus(`❌ ${e.message}`); }
    setGhLoading(false);
  };

  const ghVerHistorico = async (filePath) => {
    setGhLoading(true); setGhStatus('🕐 Carregando histórico...');
    try {
      const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/commits?path=${filePath}&per_page=30`, { headers: ghHdrs() });
      if (res.ok) { const commits = await res.json(); setGhHistorico({ path: filePath, commits }); setGhStatus(''); }
      else { setGhStatus('❌ Erro ao buscar histórico'); }
    } catch(e) { setGhStatus(`❌ ${e.message}`); }
    setGhLoading(false);
  };

  // ── CRUD de Índices ────────────────────────────────────────────────────────
  // ANS anual: a alteração propaga automaticamente para os 12 meses correspondentes
  // (mês 05 do ano até mês 04 do ano seguinte, conforme padrão do mercado).
  const propagarAnsParaMensal = React.useCallback((ano, valor, baseMensais) => {
    const novoMensais = { ...baseMensais };
    const mesesAbrangidos = [];
    for (let m = 5; m <= 12; m++) mesesAbrangidos.push(`${ano}-${String(m).padStart(2,'0')}`);
    for (let m = 1; m <= 4; m++) mesesAbrangidos.push(`${parseInt(ano,10)+1}-${String(m).padStart(2,'0')}`);
    mesesAbrangidos.forEach(mesAno => {
      const existeNoBase = INDICES[mesAno] !== undefined;
      if (existeNoBase) {
        const base = INDICES[mesAno];
        novoMensais[mesAno] = { ...base, ...(novoMensais[mesAno] || {}), an: valor };
      } else {
        const existente = novoMensais[mesAno] || {};
        novoMensais[mesAno] = { ...existente, an: valor };
      }
    });
    return novoMensais;
  }, []);

  const addOrUpdateAnsAnual = (ano, percentualStr) => {
    if (!/^\d{4}$/.test(String(ano))) { alert('Ano inválido. Use 4 dígitos.'); return false; }
    const pct = parseFloat(String(percentualStr).replace(',', '.'));
    if (isNaN(pct)) { alert('Percentual inválido.'); return false; }
    const valor = pct / 100;
    setIndicesCustomAns(prev => ({ ...prev, [ano]: valor }));
    setIndicesCustomMensais(prev => propagarAnsParaMensal(ano, valor, prev));
    return true;
  };

  const deleteAnsAnual = (ano) => {
    const ehCustom = Object.prototype.hasOwnProperty.call(indicesCustomAns, ano);
    const ehPadrao = Object.prototype.hasOwnProperty.call(ANS_ANO, ano);
    if (!ehCustom && !ehPadrao) return;
    const msg = ehPadrao && !ehCustom
      ? `Excluir ANS ${ano} (valor padrão da tabela)? Os 12 meses correspondentes ficarão com ANS = 0.`
      : `Restaurar ANS ${ano} ao valor padrão?`;
    if (!window.confirm(msg)) return;
    if (ehCustom) {
      setIndicesCustomAns(prev => { const n = { ...prev }; delete n[ano]; return n; });
      // Ao remover custom, re-propaga o padrão (se existir) para os 12 meses
      const valorPadrao = ANS_ANO[ano] ?? 0;
      setIndicesCustomMensais(prev => {
        const limpo = { ...prev };
        // Remove override monthly que veio da propagação do custom
        const mesesAbrangidos = [];
        for (let m = 5; m <= 12; m++) mesesAbrangidos.push(`${ano}-${String(m).padStart(2,'0')}`);
        for (let m = 1; m <= 4; m++) mesesAbrangidos.push(`${parseInt(ano,10)+1}-${String(m).padStart(2,'0')}`);
        mesesAbrangidos.forEach(mesAno => {
          // Se o mensal custom SÓ tem override de 'an', remove inteiro (volta ao padrão)
          // Se tem outros campos, mantém outros e restaura 'an' do padrão
          if (limpo[mesAno]) {
            const { an, ...resto } = limpo[mesAno];
            const basePadrao = INDICES[mesAno];
            const temOutrasMudancas = basePadrao && Object.keys(resto).some(k => resto[k] !== basePadrao[k]);
            if (!temOutrasMudancas) { delete limpo[mesAno]; }
            else { limpo[mesAno] = resto; }
          }
        });
        return limpo;
      });
    } else {
      // Excluir valor padrão: grava um override zerado no custom
      setIndicesCustomAns(prev => ({ ...prev, [ano]: 0 }));
      setIndicesCustomMensais(prev => propagarAnsParaMensal(ano, 0, prev));
    }
  };

  const addOrUpdateIndiceMensal = (mesAno, campos) => {
    if (!/^\d{4}-\d{2}$/.test(mesAno)) { alert('Mês-Ano inválido. Use formato AAAA-MM.'); return false; }
    const mm = parseInt(mesAno.slice(5), 10);
    if (mm < 1 || mm > 12) { alert('Mês inválido.'); return false; }
    const baseExistente = INDICES[mesAno] || indicesCustomMensais[mesAno] || { ia: 1, an: 0, ca: 1, fa: 1, sa: 1 };
    const novo = { ...baseExistente };
    ['ia','an','ca','fa','sa'].forEach(k => {
      if (campos[k] !== undefined && campos[k] !== '' && campos[k] !== null) {
        const v = parseFloat(String(campos[k]).replace(',', '.'));
        if (!isNaN(v)) novo[k] = v;
      }
    });
    setIndicesCustomMensais(prev => ({ ...prev, [mesAno]: novo }));
    return true;
  };

  const deleteIndiceMensal = (mesAno) => {
    const ehCustom = Object.prototype.hasOwnProperty.call(indicesCustomMensais, mesAno);
    if (!ehCustom) {
      if (!window.confirm(`Excluir mês ${mesAno} da tabela padrão? Um override zerado será criado.`)) return;
      setIndicesCustomMensais(prev => ({ ...prev, [mesAno]: { ia: 1, an: 0, ca: 1, fa: 1, sa: 1 } }));
      return;
    }
    const existeNoBase = INDICES[mesAno] !== undefined;
    const msg = existeNoBase
      ? `Restaurar ${mesAno} ao valor padrão?`
      : `⚠️ ${mesAno} não existe no dataset padrão (que vai até 2026-02). Restaurar vai REMOVER esse mês da tabela. Continuar?`;
    if (!window.confirm(msg)) return;
    setIndicesCustomMensais(prev => { const n = { ...prev }; delete n[mesAno]; return n; });
  };

  // ── Conversão acumulado ↔ mensal ──────────────────────────────────────────
  const calcMensalFrac = (mesAno, field) => {
    const chaves = Object.keys(INDICES_MERGED).sort();
    const idx = chaves.indexOf(mesAno);
    if (idx === -1 || idx === chaves.length - 1) return null;
    const cur = INDICES_MERGED[mesAno];
    const next = INDICES_MERGED[chaves[idx + 1]];
    if (!cur || !next) return null;
    const cv = cur[field];
    const nv = next[field];
    if (!cv || !nv || nv === 0) return null;
    return (cv / nv) - 1;
  };

  // Aplica edição monthly-pct com propagação forward (semântica b).
  const aplicarEdicaoMensalPct = (mesAno, pcts) => {
    if (!/^\d{4}-\d{2}$/.test(mesAno)) { alert('Mês-Ano inválido.'); return false; }
    const chaves = Object.keys(INDICES_MERGED).sort();
    const idx = chaves.indexOf(mesAno);
    if (idx < 0) { alert('Mês não existe no dataset.'); return false; }

    const limites = { ipca: 0.05, inpc: 0.05, fipe: 0.05, selic: 0.05 };
    const fora = [];
    ['ipca','inpc','fipe','selic'].forEach(k => {
      const v = pcts[k];
      if (v === null || v === undefined || isNaN(v)) return;
      if (v < -0.03 || v > limites[k]) fora.push(`${k.toUpperCase()}: ${(v*100).toFixed(4)}%`);
    });
    if (pcts.ans !== null && pcts.ans !== undefined && !isNaN(pcts.ans)) {
      if (pcts.ans < -0.20 || pcts.ans > 0.50) fora.push(`ANS: ${(pcts.ans*100).toFixed(4)}%`);
    }
    if (fora.length > 0) {
      if (!window.confirm(`Os seguintes valores estão fora da faixa usual:\n\n${fora.join('\n')}\n\nConfirmar mesmo assim?`)) return false;
    }

    const mapFieldFromKey = { ipca: 'ca', inpc: 'ia', fipe: 'fa', selic: 'sa' };

    setIndicesCustomMensais(prev => {
      const novo = { ...prev };
      const merged = { ...INDICES, ...prev };

      ['ipca','inpc','fipe','selic'].forEach(k => {
        const frac = pcts[k];
        if (frac === null || frac === undefined || isNaN(frac)) return;
        const field = mapFieldFromKey[k];
        const prevMes = merged[chaves[idx - 1]];
        if (!prevMes || !prevMes[field]) { try { console.warn('[Índices] Sem mês anterior para', k, 'em', mesAno); } catch(e) {} return; }
        const novoAcum = prevMes[field] / (1 + frac);
        const atualAcum = (merged[mesAno] && merged[mesAno][field]) ? merged[mesAno][field] : novoAcum;
        if (!atualAcum || atualAcum === 0) return;
        const fator = novoAcum / atualAcum;
        for (let i = idx; i < chaves.length; i++) {
          const mi = chaves[i];
          const baseMi = novo[mi] || { ...(INDICES[mi] || {}) };
          const valorAtual = (baseMi[field] !== undefined ? baseMi[field] : (INDICES[mi] && INDICES[mi][field]));
          if (valorAtual === undefined || valorAtual === null) continue;
          baseMi[field] = valorAtual * fator;
          novo[mi] = baseMi;
        }
      });

      if (pcts.ans !== null && pcts.ans !== undefined && !isNaN(pcts.ans)) {
        const baseMi = novo[mesAno] || { ...(INDICES[mesAno] || {}) };
        baseMi.an = pcts.ans;
        novo[mesAno] = baseMi;
      }

      return novo;
    });
    return true;
  };

  const iniciarEdicaoIndiceMes = (mesAno) => {
    const fmtPctLocal = (f) => f === null ? '' : (f * 100).toFixed(4).replace('.', ',');
    setEditandoIndiceMes(mesAno);
    setEditIndicePctIpca(fmtPctLocal(calcMensalFrac(mesAno, 'ca')));
    setEditIndicePctInpc(fmtPctLocal(calcMensalFrac(mesAno, 'ia')));
    setEditIndicePctFipe(fmtPctLocal(calcMensalFrac(mesAno, 'fa')));
    setEditIndicePctSelic(fmtPctLocal(calcMensalFrac(mesAno, 'sa')));
    const dados = INDICES_MERGED[mesAno] || {};
    setEditIndicePctAns(dados.an !== undefined ? ((dados.an || 0) * 100).toFixed(4).replace('.', ',') : '');
  };
  const cancelarEdicaoIndiceMes = () => {
    setEditandoIndiceMes(null);
    setEditIndicePctIpca(''); setEditIndicePctInpc(''); setEditIndicePctFipe(''); setEditIndicePctSelic(''); setEditIndicePctAns('');
  };
  const salvarEdicaoIndiceMes = () => {
    if (!editandoIndiceMes) return;
    const parsePct = (s) => {
      const t = String(s).trim().replace(',', '.');
      if (t === '') return null;
      const n = parseFloat(t);
      if (isNaN(n)) return null;
      return n / 100;
    };
    const pcts = {
      ipca: parsePct(editIndicePctIpca),
      inpc: parsePct(editIndicePctInpc),
      fipe: parsePct(editIndicePctFipe),
      selic: parsePct(editIndicePctSelic),
      ans: parsePct(editIndicePctAns),
    };
    if (aplicarEdicaoMensalPct(editandoIndiceMes, pcts)) {
      cancelarEdicaoIndiceMes();
    }
  };


  // Calcula mês imediatamente anterior no formato AAAA-MM
  const _mesAnterior = (mesAno) => {
    const [a, m] = mesAno.split('-').map(Number);
    const d = new Date(a, m - 2, 1);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  };

  // Adiciona um mês novo a partir de % mensais. Calcula ca/ia/fa/sa a partir do predecessor.
  const adicionarMensalPct = (mesAno, pcts) => {
    if (!/^\d{4}-\d{2}$/.test(mesAno)) { alert('Mês-Ano inválido. Use formato AAAA-MM (ex.: 2026-03).'); return false; }
    const mm = parseInt(mesAno.slice(5), 10);
    if (mm < 1 || mm > 12) { alert('Mês inválido.'); return false; }

    const mesAnt = _mesAnterior(mesAno);
    const prev = INDICES_MERGED[mesAnt];
    if (!prev) { alert('Predecessor ' + mesAnt + ' não existe no sistema. Adicione ' + mesAnt + ' antes.'); return false; }

    const limites = { ipca: 0.05, inpc: 0.05, fipe: 0.05, selic: 0.05 };
    const fora = [];
    ['ipca','inpc','fipe','selic'].forEach(k => {
      const v = pcts[k];
      if (v === null || v === undefined || isNaN(v)) return;
      if (v < -0.03 || v > limites[k]) fora.push(`${k.toUpperCase()}: ${(v*100).toFixed(4)}%`);
    });
    if (pcts.ans !== null && pcts.ans !== undefined && !isNaN(pcts.ans)) {
      if (pcts.ans < -0.20 || pcts.ans > 0.50) fora.push(`ANS: ${(pcts.ans*100).toFixed(4)}%`);
    }
    if (fora.length > 0) {
      if (!window.confirm('Os seguintes valores estão fora da faixa usual:\n\n' + fora.join('\n') + '\n\nConfirmar mesmo assim?')) return false;
    }

    const mapField = { ipca: 'ca', inpc: 'ia', fipe: 'fa', selic: 'sa' };
    const novo = {};
    ['ipca','inpc','fipe','selic'].forEach(k => {
      const frac = pcts[k];
      const field = mapField[k];
      const prevAcum = prev[field];
      if (frac === null || frac === undefined || isNaN(frac) || !prevAcum) return;
      novo[field] = prevAcum / (1 + frac);
    });
    if (pcts.ans !== null && pcts.ans !== undefined && !isNaN(pcts.ans)) {
      novo.an = pcts.ans;
    } else if (prev.an !== undefined) {
      // herda ANS do mês anterior se não foi informado (cobre edge case de mês fora do aniversário)
      novo.an = prev.an;
    }

    if (Object.keys(novo).length === 0) { alert('Nenhum campo informado.'); return false; }

    setIndicesCustomMensais(prev2 => ({ ...prev2, [mesAno]: novo }));
    return true;
  };

  // ── GitHub: persistência de índices globais ───────────────────────────────
  const [ghIndicesStatus, setGhIndicesStatus] = React.useState('');
  const [ghIndicesLoading, setGhIndicesLoading] = React.useState(false);
  const indicesLoadedRef = React.useRef(false);
  const indicesAutoSaveTimer = React.useRef(null);

  const calcularResultados = React.useMemo(() => {
    return () => {
      let todosPorSeguro = [];
      let todosPorCNPJ = {};

      beneficiarios.forEach(ben => {
        const cnpj = cnpjs.find(c => c.id === parseInt(ben.cnpjId));
        if (!cnpj) return;

        const reajustesBen = reajustes
          .filter(r => r.beneficiarioId === ben.id.toString() && r.mesAno <= configDataFim)
          .sort((a, b) => a.mesAno.localeCompare(b.mesAno));

        let valorAnterior = 0;
        reajustesBen.forEach((rej, idx) => {
          const mesAno = rej.mesAno;
          const valorPago = parseFloat(rej.valorPago) || 0;
          const reajusteAplicado = parseFloat(rej.reajusteAplicado);
          const reajusteNegativo = (parseFloat(rej.reajusteNegativo) || 0) / 100;
          const mudancaIdade = (parseFloat(rej.mudancaIdade) || 0) / 100;

          let valorDevido;
          if (idx === 0) {
            valorDevido = valorPago;
          } else {
            // Reajuste devido (D): ANS do ano SÓ no mês de aniversário do contrato (configMesReajuste).
            // Nos demais meses, D=0. Replica comportamento da planilha do escritório.
            const mesNum = parseInt(mesAno.slice(5), 10);
            const isMesAniversario = mesNum === parseInt(configMesReajuste, 10);
            const ansRate = isMesAniversario ? (INDICES_MERGED[mesAno]?.an || 0) : 0;
            const hasReajuste = rej.reajusteAplicado !== '' && rej.reajusteAplicado != null && !isNaN(reajusteAplicado);
            const applied = hasReajuste ? reajusteAplicado / 100 : null;

            if (applied !== null) {
              if (applied < 0) {
                valorDevido = valorAnterior * (1 + ansRate) * (1 + reajusteNegativo) * (1 + mudancaIdade);
              } else {
                const minAdjust = Math.min(applied, ansRate);
                valorDevido = valorAnterior * (1 + minAdjust) * (1 + reajusteNegativo) * (1 + mudancaIdade);
              }
            } else {
              // No reajuste this month — value carries forward with only age/neg adjustments
              valorDevido = valorAnterior * (1 + reajusteNegativo) * (1 + mudancaIdade);
            }
          }

          const dataInicioCobr = new Date(configDataInicio);
          const mesAnoDate = new Date(mesAno + '-01');
          const diferenca = mesAnoDate >= dataInicioCobr ? Math.max(0, valorPago - valorDevido) : 0;

          // Prescrição: contagem regressiva de 3 anos a partir do ajuizamento (fallback: configDataFim).
          const dataPrescricao = (configDataAjuizamento && /^\d{4}-\d{2}$/.test(configDataAjuizamento)) ? configDataAjuizamento : configDataFim;
          const fimDate = new Date(dataPrescricao + '-01');
          const daysDiff = (fimDate - new Date(mesAno + '-01')) / (1000 * 60 * 60 * 24);
          const years = Math.floor(daysDiff) / 365.25;
          const prescrito = years >= 3;

          // Modo "padrão planilha" (legado, Scozziero): usa fator acumulado direto.
          // Modo "ultimo" (novo default): normaliza pelo último mês do dataset — alinha com
          // planilhas modernas que usam IPCA real divulgado como data-base.
          // Modo "custom": divide pelo fator do mês de referência configurado.
          const isUltimo = configRefMes === 'ultimo';
          const isBasePlanilha = !isUltimo && (!configRefMes || configRefMes === 'baseplanilha' || !INDICES_MERGED[configRefMes]);
          const _chavesAllRef = Object.keys(INDICES_MERGED).sort();
          const _ultimoMesRef = _chavesAllRef.length > 0 ? _chavesAllRef[_chavesAllRef.length - 1] : null;

          let fatorCorrecao = 1.0;
          if (configIndexador !== 'sem') {
            const correcaoMes = INDICES_MERGED[mesAno]?.[configIndexador];
            if (isBasePlanilha) {
              if (correcaoMes) fatorCorrecao = correcaoMes;
            } else if (isUltimo) {
              const correcaoUltimo = _ultimoMesRef ? INDICES_MERGED[_ultimoMesRef]?.[configIndexador] : null;
              if (correcaoUltimo && correcaoMes) fatorCorrecao = correcaoMes / correcaoUltimo;
            } else {
              const correcaoRef = INDICES_MERGED[configRefMes]?.[configIndexador];
              if (correcaoRef && correcaoMes) fatorCorrecao = correcaoMes / correcaoRef;
            }
          }

          let jurosPercent = 0;
          if (configJuros !== 'sem') {
            const selicMes = INDICES_MERGED[mesAno]?.sa || 1;
            let selicRef = 1;
            if (!isBasePlanilha) {
              if (isUltimo) {
                selicRef = (_ultimoMesRef && INDICES_MERGED[_ultimoMesRef]?.sa) || 1;
              } else {
                selicRef = INDICES_MERGED[configRefMes]?.sa || 1;
              }
            }
            const selicAccum = selicMes / selicRef - 1;

            if (configJuros === 'selic') {
              jurosPercent = Math.max(0, selicAccum);
            } else {
              const AUG_2024 = '2024-08';
              if (mesAno <= AUG_2024) {
                const diffMeses = (new Date(AUG_2024).getFullYear() - new Date(mesAno).getFullYear()) * 12 +
                                  (new Date(AUG_2024).getMonth() - new Date(mesAno).getMonth());
                jurosPercent = 0.01 * (diffMeses + 1) + selicAccum;
              } else {
                jurosPercent = Math.max(0, selicAccum);
              }
            }
          }

          const totalAtualizado = prescrito ? 0 : diferenca * fatorCorrecao * (1 + jurosPercent);

          const row = {
            mesAno,
            valorPago,
            valorDevido: parseFloat(valorDevido.toFixed(2)),
            diferenca: parseFloat(diferenca.toFixed(2)),
            prescrito,
            fatorCorrecao: parseFloat(fatorCorrecao.toFixed(6)),
            jurosPercent,
            totalAtualizado: parseFloat(totalAtualizado.toFixed(2)),
            beneficiario: ben.nome,
            cnpj: cnpj.cnpj,
            cnpjId: cnpj.id
          };

          todosPorSeguro.push(row);
          valorAnterior = valorDevido;

          if (!todosPorCNPJ[cnpj.id]) {
            todosPorCNPJ[cnpj.id] = { cnpj: cnpj.cnpj, empresa: cnpj.empresa, rows: [] };
          }
          todosPorCNPJ[cnpj.id].rows.push(row);
        });
      });

      return { todosPorSeguro, todosPorCNPJ };
    };
  }, [beneficiarios, reajustes, cnpjs, configIndexador, configJuros, configRefMes, configDataFim, configDataInicio, configDataAjuizamento, configMesReajuste]);

        totalRestituir += row.totalAtualizado;
        excesso += row.diferenca;
        correcao += row.diferenca * (row.fatorCorrecao - 1);
        juros += row.diferenca * row.fatorCorrecao * row.jurosPercent;
      } else {
        prescrito += row.diferenca;
      }
    });
    return { totalRestituir: parseFloat(totalRestituir.toFixed(2)), excesso: parseFloat(excesso.toFixed(2)), correcao: parseFloat(correcao.toFixed(2)), juros: parseFloat(juros.toFixed(2)), prescrito: parseFloat(prescrito.toFixed(2)) };

                            <td className="text-right">{inputEdit(editIndicePctSelic, setEditIndicePctSelic, '0,90')}</td>
                            <td className="text-right">{inputEdit(editIndicePctAns, setEditIndicePctAns, '6,06')}</td>
                            <td><span style={{fontSize:'0.85em', color:'#C8A96E'}}>✏️ Editando</span></td>
                            <td>
                              <button onClick={salvarEdicaoIndiceMes} style={{marginRight:'6px', fontSize:'0.85em'}}>💾 Salvar</button>
                              <button onClick={cancelarEdicaoIndiceMes} style={{fontSize:'0.85em'}} className="secondary">Cancelar</button>
                            </td>
                          </tr>
                        );
                      }
                      return (
                        <tr key={mesAno} style={ehCustom ? {backgroundColor:'#FFF9E6'} : {}}>
                          <td>{mesAno}</td>
                          <td className="text-right">{celMensal('ca', mesAno)}</td>
                          <td className="text-right">{celMensal('ia', mesAno)}</td>
                          <td className="text-right">{celMensal('fa', mesAno)}</td>
                          <td className="text-right">{celMensal('sa', mesAno)}</td>
                          <td className="text-right">{((dados.an ?? 0) * 100).toFixed(4).replace('.', ',')}%</td>
                          <td><span style={{fontSize:'0.85em', color: ehCustom ? '#C8A96E' : '#64748B'}}>{ehCustom ? '✏️ Custom' : 'Padrão'}</span></td>
                          <td>
                            <button onClick={() => iniciarEdicaoIndiceMes(mesAno)} disabled={editandoIndiceMes !== null} style={{marginRight:'6px', fontSize:'0.85em'}}>✏️ Editar</button>
                            <button onClick={() => deleteIndiceMensal(mesAno)} style={{fontSize:'0.85em', color:'#B91C1C'}}>{ehCustom ? '↩️ Restaurar' : '🗑️ Excluir'}</button>
                          </td>
                        </tr>
                      );
                    });
                  })()}
                </tbody>
              </table>
            </div>
          </div>
        )}
      </div>

      {/* ── Modal: Desbloqueio do Link Mágico (boot com #lm=) ───────────── */}
      {bootModal === 'unlock' && (
        <div className="lm-overlay no-print">
          <div className="lm-dialog">
            <div className="lm-header">
              <h2>🔒 Informe o PIN</h2>
              <p>Este link contém o acesso cifrado à Calculadora Scozziero. Informe o PIN de 4 a 8 dígitos para desbloquear.</p>
            </div>
            <div className="lm-body">
              <div className="lm-note">
                Ao desbloquear, o token do GitHub fica salvo <strong>neste navegador</strong>, permitindo abrir e salvar casos automaticamente.
              </div>
              <div className="lm-field">
                <label>PIN</label>
                <input type="password" inputMode="numeric" autoFocus maxLength="8"
                  placeholder="••••"
                  value={unlockPin}
                  onChange={e => { setUnlockPin(e.target.value.replace(/\D/g,'')); setBootError(''); }}
                  onKeyDown={e => { if (e.key === 'Enter') desbloquearLink(); }} />
              </div>
              {bootError && <div className="lm-error">{bootError}</div>}
              <div className="lm-actions">
                <button className="lm-btn secondary" onClick={() => { setBootModal(null); try { history.replaceState(null, '', window.location.pathname + window.location.search); } catch(e) {} }}>
                  Cancelar
                </button>
                <button className="lm-btn primary" onClick={desbloquearLink} disabled={unlockBusy}>
                  {unlockBusy ? '⏳ Decifrando...' : '🔓 Desbloquear'}
                </button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* ── Modal: Seletor de Caso (boot com token configurado) ────────── */}
      {bootModal === 'select' && (
        <div className="lm-overlay no-print">
          <div className="lm-dialog">
            <div className="lm-header">
              <h2>📂 Seus Casos</h2>
              <p>Escolha um caso para carregar ou inicie um novo em branco.</p>
            </div>
            <div className="lm-body">
              {ghLoading && <div className="lm-note">⏳ Buscando casos no GitHub...</div>}
              {!ghLoading && ghCasos.length === 0 && (
                <div className="lm-note">Nenhum caso salvo no repositório ainda. Comece um novo abaixo.</div>
              )}
              {!ghLoading && ghCasos.length > 0 && (
                <div style={{maxHeight:'320px',overflowY:'auto',marginBottom:'12px'}}>
                  {ghCasos.map(f => (
                    <div key={f.sha} className="lm-caso-item">
                      <div>
                        <div className="nome">📄 {f.name.replace('.json','').replace(/_/g,' ')}</div>
                        <div className="meta">{(f.size/1024).toFixed(1)} KB</div>
                      </div>
                      <button className="lm-btn primary" onClick={async () => { await ghCarregar(f); setBootModal(null); }} style={{padding:'6px 14px',fontSize:'13px'}}>
                        📂 Carregar
                      </button>
                    </div>
                  ))}
                </div>
              )}
              <div className="lm-actions" style={{justifyContent:'space-between'}}>
                <button className="lm-btn secondary" onClick={() => ghListCasosComToken(ghToken)} disabled={ghLoading}>
                  🔄 Atualizar lista
                </button>
                <div style={{display:'flex',gap:'8px'}}>
                  <button className="lm-btn secondary" onClick={() => setBootModal(null)}>
                    Fechar
                  </button>
                  <button className="lm-btn gold" onClick={novoCasoEmBranco}>
                    🆕 Novo Caso em Branco
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* ── Modal: Gerar Link Mágico ───────────────────────────────────── */}
      {linkGenOpen && (
        <div className="lm-overlay no-print">
          <div className="lm-dialog">
            <div className="lm-header">
              <h2>🔗 Gerar Link Mágico</h2>
              <p>Crie um PIN para cifrar o token. Você precisará dele ao abrir o link em outros dispositivos.</p>
            </div>
            <div className="lm-body">
              {!linkGenResult && (
                <>
                  <div className="lm-note">
                    O token do GitHub será cifrado com seu PIN (AES-GCM + PBKDF2 250k iterações). O PIN <strong>não fica salvo</strong> em lugar nenhum — se esquecer, gera outro link.
                  </div>
                  <div className="lm-field">
                    <label>PIN (4 a 8 dígitos)</label>
                    <input type="password" inputMode="numeric" maxLength="8" autoFocus
                      placeholder="••••"
                      value={linkPin1}
                      onChange={e => { setLinkPin1(e.target.value.replace(/\D/g,'')); setLinkGenError(''); }} />
                  </div>
                  <div className="lm-field">
                    <label>Confirme o PIN</label>
                    <input type="password" inputMode="numeric" maxLength="8"
                      placeholder="••••"
                      value={linkPin2}
                      onChange={e => { setLinkPin2(e.target.value.replace(/\D/g,'')); setLinkGenError(''); }}
                      onKeyDown={e => { if (e.key === 'Enter') gerarLinkMagico(); }} />
                  </div>
                  {linkGenError && <div className="lm-error">{linkGenError}</div>}
                  <div className="lm-actions">
                    <button className="lm-btn secondary" onClick={fecharLinkGen}>Cancelar</button>
                    <button className="lm-btn primary" onClick={gerarLinkMagico}>Gerar Link</button>
                  </div>
                </>
              )}
              {linkGenResult && (
                <>
                  <div className="lm-ok">✅ Link gerado. Salve como favorito nos dispositivos onde quer acessar.</div>
                  <div className="lm-link-output">{linkGenResult}</div>
                  {linkCopyStatus && <div className={linkCopyStatus.startsWith('✅') ? 'lm-ok' : 'lm-note'}>{linkCopyStatus}</div>}
                  <div className="lm-note" style={{marginTop:'12px'}}>
                    <strong>Próximos passos</strong>:<br/>
                    1. Envie o link para o seu celular/outro PC (email, WhatsApp para si mesmo, etc.)<br/>
                    2. Abra o link no outro dispositivo → digite o PIN → pronto, a calculadora lista seus casos.<br/>
                    3. Guarde o PIN num lugar separado do link.
                  </div>
                  <div className="lm-actions">
                    <button className="lm-btn secondary" onClick={fecharLinkGen}>Fechar</button>
                    <button className="lm-btn primary" onClick={copiarLinkMagico}>📋 Copiar Link</button>
                  </div>
                </>
              )}
            </div>
          </div>
        </div>
      )}
      {/* ═══════════════════════════════════════════════════════════════
          IMPRESSÃO COMPLETA — renderizado fora das abas, visível só @print
          ═══════════════════════════════════════════════════════════════ */}
      {imprimirTudo && (
        <div id="print-all-doc">
          {/* ── DASHBOARD ── */}
          {renderCapa('Demonstrativo Consolidado de Revisão de Mensalidades', null)}
          <div className="kpi-grid">
            <div className="kpi-card green">
              <div className="kpi-label">Total a Restituir</div>
              <div className="kpi-value"><BRLStack n={metricas.totalRestituir}/></div>
              <div className="info-text">Repetição Indébito: {fmtBRL(metricas.totalRestituir * 2)}</div>
            </div>
            <div className="kpi-card orange">
              <div className="kpi-label">Excesso Bruto</div>
              <div className="kpi-value"><BRLStack n={metricas.excesso}/></div>
              <div className="info-text">{beneficiarios.length} Segurado{beneficiarios.length !== 1 ? 's' : ''}</div>
            </div>
            <div className="kpi-card blue">
              <div className="kpi-label">Correção Monetária</div>
              <div className="kpi-value"><BRLStack n={metricas.correcao}/></div>
              <div className="info-text">{cnpjs.length} CNPJ{cnpjs.length !== 1 ? 's' : ''}</div>
            </div>
            <div className="kpi-card purple">
              <div className="kpi-label">Juros de Mora</div>
              <div className="kpi-value"><BRLStack n={metricas.juros}/></div>
            </div>
            <div className="kpi-card gray">
              <div className="kpi-label">Prescrito</div>
              <div className="kpi-value"><BRLStack n={metricas.prescrito}/></div>
            </div>
          </div>
          <div className="section">
            <h3 style={{marginBottom:'12px'}}>Consolidado por Segurado</h3>
            {(() => {
              const porBen = {};
              resultados.todosPorSeguro.forEach(r => {
                if (!porBen[r.beneficiario]) porBen[r.beneficiario] = { pago:0, devido:0, excesso:0, correcao:0, juros:0, prescrito:0, total:0, cnpj:r.cnpj };
                porBen[r.beneficiario].pago   += r.valorPago;
                porBen[r.beneficiario].devido += r.valorDevido;
                if (r.prescrito) { porBen[r.beneficiario].prescrito += r.diferenca; }
                else { porBen[r.beneficiario].excesso += r.diferenca; porBen[r.beneficiario].correcao += r.diferenca*(r.fatorCorrecao-1); porBen[r.beneficiario].juros += r.diferenca*r.fatorCorrecao*r.jurosPercent; porBen[r.beneficiario].total += r.totalAtualizado; }
              });
              const nomes = Object.keys(porBen).sort();
              const tot = { pago:0, devido:0, excesso:0, correcao:0, juros:0, prescrito:0, total:0 };
              nomes.forEach(n => { tot.pago+=porBen[n].pago; tot.devido+=porBen[n].devido; tot.excesso+=porBen[n].excesso; tot.correcao+=porBen[n].correcao; tot.juros+=porBen[n].juros; tot.prescrito+=porBen[n].prescrito; tot.total+=porBen[n].total; });
              return (
                <table className="table">
                  <thead><tr><th>Segurado</th><th>CNPJ</th><th className="text-right">Total Pago</th><th className="text-right">Total Devido</th><th className="text-right">Excesso</th><th className="text-right">Correção</th><th className="text-right">Juros</th><th className="text-right">Prescrito</th><th className="text-right">A Restituir</th></tr></thead>
                  <tbody>
                    {nomes.map(n => (<tr key={n}><td>{n}</td><td>{porBen[n].cnpj}</td><td className="text-right"><BRLStack n={porBen[n].pago}/></td><td className="text-right"><BRLStack n={porBen[n].devido}/></td><td className="text-right"><BRLStack n={porBen[n].excesso}/></td><td className="text-right"><BRLStack n={porBen[n].correcao}/></td><td className="text-right"><BRLStack n={porBen[n].juros}/></td><td className="text-right"><BRLStack n={porBen[n].prescrito}/></td><td className="text-right"><strong><BRLStack n={porBen[n].total}/></strong></td></tr>))}
                    <tr style={{background:'#f0f4f8',fontWeight:'700'}}><td colSpan="2">TOTAL</td><td className="text-right"><BRLStack n={tot.pago}/></td><td className="text-right"><BRLStack n={tot.devido}/></td><td className="text-right"><BRLStack n={tot.excesso}/></td><td className="text-right"><BRLStack n={tot.correcao}/></td><td className="text-right"><BRLStack n={tot.juros}/></td><td className="text-right"><BRLStack n={tot.prescrito}/></td><td className="text-right"><BRLStack n={tot.total}/></td></tr>
                  </tbody>
                </table>
              );
            })()}
          </div>
          {/* ── RELATÓRIOS INDIVIDUAIS ── */}
          {beneficiarios.map((benItem) => {
            const cnpjItem = cnpjs.find(c => c.id.toString() === benItem.cnpjId);
            const rowsItem = resultados.todosPorSeguro.filter(r => r.beneficiario === benItem.nome);
            let totItem = { pago:0, devido:0, excesso:0, prescrito:0, correcao:0, juros:0, total:0 };
            rowsItem.forEach(r => {
              totItem.pago += r.valorPago; totItem.devido += r.valorDevido;
              if (r.prescrito) { totItem.prescrito += r.diferenca; }
              else { totItem.excesso += r.diferenca; totItem.correcao += r.diferenca*(r.fatorCorrecao-1); totItem.juros += r.diferenca*r.fatorCorrecao*r.jurosPercent; totItem.total += r.totalAtualizado; }
            });
            const yearOrderI = []; const yearIdxI = {};
            rowsItem.forEach(r => { const y = (r.mesAno||'').slice(0,4); if (!yearOrderI.includes(y)) yearOrderI.push(y); });
            yearOrderI.forEach((y, idx) => { yearIdxI[y] = idx; });
            return (
              <React.Fragment key={benItem.id}>
                <div className="page-break"></div>
                {renderCapa('Relatório Analítico Individual — Revisão de Mensalidades', benItem.nome)}
                <div className="kpi-grid">
                  <div className="kpi-card green"><div className="kpi-label">A Restituir (atualizado)</div><div className="kpi-value"><BRLStack n={totItem.total}/></div><div className="info-text">Repetição Indébito: {fmtBRL(totItem.total*2)}</div></div>
                  <div className="kpi-card orange"><div className="kpi-label">Excesso Bruto</div><div className="kpi-value"><BRLStack n={totItem.excesso}/></div><div className="info-text">{rowsItem.filter(r=>!r.prescrito).length} parcela{rowsItem.filter(r=>!r.prescrito).length!==1?'s exigíveis':' exigível'}</div></div>
                  <div className="kpi-card blue"><div className="kpi-label">Correção Monetária</div><div className="kpi-value"><BRLStack n={totItem.correcao}/></div><div className="info-text">{configIndexador==='ca'?'IPCA':configIndexador==='ia'?'INPC':configIndexador==='fa'?'FIPE':'Sem correção'}</div></div>
                  <div className="kpi-card purple"><div className="kpi-label">Juros de Mora</div><div className="kpi-value"><BRLStack n={totItem.juros}/></div><div className="info-text">{configJuros==='hybrid'?'1% a.m. + SELIC':configJuros==='selic'?'SELIC':'Sem juros'}</div></div>
                  <div className="kpi-card gray"><div className="kpi-label">Prescrito</div><div className="kpi-value"><BRLStack n={totItem.prescrito}/></div><div className="info-text">{rowsItem.filter(r=>r.prescrito).length} parcela{rowsItem.filter(r=>r.prescrito).length!==1?'s prescritas':' prescrita'}</div></div>
                </div>
                <div className="section">
                  <h3>Identificação</h3>
                  <table className="table"><tbody>
                    <tr><th style={{width:'40%'}}>Nome</th><td>{benItem.nome||'—'}</td></tr>
                    <tr><th>CPF</th><td>{benItem.cpf||'—'}</td></tr>
                    <tr><th>Data de Nascimento</th><td>{benItem.dataNascimento||'—'}</td></tr>
                    <tr><th>Data de Adesão</th><td>{benItem.dataAdesao||'—'}</td></tr>
                    <tr><th>Carteirinha</th><td>{benItem.numeroCarteirinha||'—'}</td></tr>
                    <tr><th>CNPJ Contratante</th><td>{cnpjItem?.cnpj||'—'}</td></tr>
                    <tr><th>Empresa</th><td>{cnpjItem?.empresa||'—'}</td></tr>
                    <tr><th>Operadora</th><td>{cnpjItem?.operadora||'—'}</td></tr>
                    <tr><th>Contrato</th><td>{cnpjItem?.nrContrato||'—'}</td></tr>
                  </tbody></table>
                </div>
                <div className="section">
                  <h3>Parâmetros da Revisão</h3>
                  <table className="table"><tbody>
                    <tr><th style={{width:'40%'}}>Indexador</th><td>{configIndexador==='ca'?'IPCA':configIndexador==='ia'?'INPC':configIndexador==='fa'?'FIPE':'Sem correção'}</td></tr>
                    <tr><th>Juros</th><td>{configJuros==='hybrid'?'1% a.m. até ago/2024 + SELIC acumulada':configJuros==='selic'?'SELIC acumulada':'Sem juros'}</td></tr>
                    <tr><th>Modo Fator</th><td>{configRefMes==='baseplanilha'?'Padrão planilha (fator direto)':`Dividir por ${configRefMes}`}</td></tr>
                    <tr><th>Mês de aniversário</th><td>{['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][configMesReajuste-1]}</td></tr>
                    <tr><th>Data-limite do cálculo</th><td>{fmtMesAno(configDataFim)}</td></tr>
                    <tr><th>Data inicial das diferenças</th><td>{configDataInicio}</td></tr>
                  </tbody></table>
                </div>
                <div className="section">
                  <h3>Demonstrativo Mês a Mês</h3>
                  {rowsItem.length===0 ? <p style={{color:'#999'}}>Sem reajustes lançados.</p> : (
                    <table className="table table-ano">
                      <thead><tr><th>Mês</th><th className="text-right">Valor Pago</th><th className="text-right">Valor Devido</th><th className="text-right">Excesso</th><th className="text-center">Prescrito</th><th className="text-right">Fator</th><th className="text-right">Juros %</th><th className="text-right">Total Atualizado</th></tr></thead>
                      <tbody>
                        {rowsItem.map((r,i) => {
                          const y=(r.mesAno||'').slice(0,4); const idx=yearIdxI[y]??0;
                          const bg=r.prescrito?'#EDE5ED':(idx%2===0?'#FFFFFF':'#F1F5F9');
                          return (<tr key={i} style={{backgroundColor:bg}}><td>{fmtMesAno(r.mesAno)}</td><td className="text-right">{fmtBRL(r.valorPago)}</td><td className="text-right">{fmtBRL(r.valorDevido)}</td><td className="text-right">{fmtBRL(r.diferenca)}</td><td className="text-center">{r.prescrito?'Sim':'Não'}</td><td className="text-right">{r.fatorCorrecao.toFixed(6)}</td><td className="text-right">{(r.jurosPercent*100).toFixed(2)}%</td><td className="text-right"><strong>{fmtBRL(r.totalAtualizado)}</strong></td></tr>);
                        })}
                        <tr style={{background:'#E2E8F0',fontWeight:'700'}}><td>TOTAL</td><td className="text-right">{fmtBRL(totItem.pago)}</td><td className="text-right">{fmtBRL(totItem.devido)}</td><td className="text-right">{fmtBRL(totItem.excesso)}</td><td></td><td></td><td></td><td className="text-right">{fmtBRL(totItem.total)}</td></tr>
                      </tbody>
                    </table>
                  )}
                </div>
                <div className="section">
                  <h3>Resumo Financeiro</h3>
                  <table className="table"><tbody>
                    <tr><th style={{width:'60%'}}>Total Pago ao longo do período</th><td className="text-right">{fmtBRL(totItem.pago)}</td></tr>
                    <tr><th>Total Devido (conforme limite ANS)</th><td className="text-right">{fmtBRL(totItem.devido)}</td></tr>
                    <tr><th>Excesso Bruto (cobrança a maior)</th><td className="text-right">{fmtBRL(totItem.excesso)}</td></tr>
                    <tr><th>Correção Monetária aplicada</th><td className="text-right">{fmtBRL(totItem.correcao)}</td></tr>
                    <tr><th>Juros de Mora aplicados</th><td className="text-right">{fmtBRL(totItem.juros)}</td></tr>
                    <tr><th>Parcelas Prescritas (não exigíveis)</th><td className="text-right">{fmtBRL(totItem.prescrito)}</td></tr>
                    <tr style={{background:'#d4edda',fontWeight:'700'}}><th>VALOR A RESTITUIR (atualizado)</th><td className="text-right"><strong>{fmtBRL(totItem.total)}</strong></td></tr>
                    <tr style={{background:'#fff3cd',fontWeight:'700'}}><th>REPETIÇÃO DE INDÉBITO (dobro — art. 42 CDC)</th><td className="text-right"><strong>{fmtBRL(totItem.total*2)}</strong></td></tr>
                  </tbody></table>
                </div>
              </React.Fragment>
            );
          })}
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<CalculadoraSaude />);
  </script>
</body>
</html
