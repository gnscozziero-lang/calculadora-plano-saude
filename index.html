<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revisão de Plano de Saúde - Scozziero Advocacia</title>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #F0F4F8;
      color: #333;
    }

    header {
      background: linear-gradient(135deg, #1B3A5C, #0d2440);
      color: white;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    header p {
      font-size: 12px;
      opacity: 0.9;
    }

    .container {
      max-width: 1400px;
      margin: 20px auto;
      padding: 0 20px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid #ddd;
      flex-wrap: wrap;
    }

    .tab-button {
      padding: 12px 20px;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: #666;
      transition: all 0.3s ease;
    }

    .tab-button.active {
      color: #1B3A5C;
      border-bottom-color: #C8A96E;
    }

    .tab-button:hover {
      color: #1B3A5C;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .kpi-card {
      background: white;
      border-left: 4px solid;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      animation: slideIn 0.4s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .kpi-card.green {
      border-left-color: #27AE60;
    }

    .kpi-card.orange {
      border-left-color: #F39C12;
    }

    .kpi-card.blue {
      border-left-color: #3498DB;
    }

    .kpi-card.purple {
      border-left-color: #9B59B6;
    }

    .kpi-card.gray {
      border-left-color: #95A5A6;
    }

    .kpi-label {
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .kpi-value {
      font-size: 24px;
      font-weight: bold;
      color: #1B3A5C;
    }

    /* R$ sempre em linha acima do valor — uniformiza leitura de KPIs e tabela consolidada. */
    .brl-stack { display: inline-flex; flex-direction: column; line-height: 1.1; align-items: flex-start; vertical-align: middle; }
    .brl-stack-cifra { font-size: 0.6em; font-weight: 500; color: #64748B; letter-spacing: 0.5px; }
    .brl-stack-valor { font-weight: inherit; }
    td.text-right .brl-stack { align-items: flex-end; }

    .kpi-icon {
      font-size: 28px;
      margin-bottom: 8px;
    }

    /* Capa do Caso — cabeçalho institucional (fundo off-white, mais leve, mantém identidade via faixas) */
    .capa-caso {
      background: #FAFBFC;
      color: #1B3A5C;
      padding: 28px 32px;
      border-radius: 10px;
      margin-bottom: 22px;
      box-shadow: 0 1px 4px rgba(27, 58, 92, 0.08);
      border: 1px solid #E2E8F0;
      border-top: 3px solid #1B3A5C;
      border-left: 6px solid #C8A96E;
    }
    .capa-caso .capa-topo {
      display: flex; justify-content: space-between; align-items: flex-start;
      border-bottom: 1px solid #E2E8F0;
      padding-bottom: 14px; margin-bottom: 16px; gap: 20px; flex-wrap: wrap;
    }
    .capa-caso h2 {
      margin: 0 0 4px 0; font-size: 22px; color: #1B3A5C; font-weight: 700;
    }
    .capa-caso .capa-sub { font-size: 13px; color: #8B6914; letter-spacing: 0.5px; font-weight: 600; }
    .capa-caso .capa-escritorio { text-align: right; font-size: 12px; line-height: 1.4; color: #475569; }
    .capa-caso .capa-escritorio strong { font-size: 14px; color: #8B6914; display: block; }
    .capa-caso .capa-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px 28px;
    }
    .capa-caso .capa-item {
      display: flex; flex-direction: column; gap: 2px;
    }
    .capa-caso .capa-item .rotulo {
      font-size: 10.5px; text-transform: uppercase; color: #64748B; letter-spacing: 0.8px; font-weight: 600;
    }
    .capa-caso .capa-item .valor { font-size: 14px; color: #1B3A5C; font-weight: 600; word-break: break-word; }
    .capa-caso .capa-item .valor.destaque { font-size: 16px; color: #8B6914; }

    .section {
      background: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    .section h2 {
      color: #1B3A5C;
      margin-bottom: 15px;
      font-size: 18px;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #555;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 13px;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #C8A96E;
      background: #FFFEF5;
    }

    button {
      padding: 10px 20px;
      background: #1B3A5C;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #0d2440;
    }

    button.secondary {
      background: #95A5A6;
    }

    button.secondary:hover {
      background: #7F8C8D;
    }

    button.danger {
      background: #E74C3C;
    }

    button.danger:hover {
      background: #C0392B;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .table thead {
      background: #F8F9FA;
      position: sticky;
      top: 0;
    }

    .table th {
      padding: 12px;
      text-align: left;
      font-weight: 600;
      color: #1B3A5C;
      border-bottom: 2px solid #ddd;
    }

    .table td {
      padding: 12px;
      border-bottom: 1px solid #eee;
    }

    .table tbody tr:nth-child(even) {
      background: #F8F9FA;
    }

    .table tbody tr:hover {
      background: #E8EAED;
    }

    /* Tabela com agrupamento por ano — desliga zebra striping para que o backgroundColor inline (definido por ano) seja a cor dominante. */
    .table-ano tbody tr:nth-child(even) { background: inherit; }
    .table-ano tbody tr:hover { filter: brightness(0.97); }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge.excesso {
      background: #FADBD8;
      color: #C0392B;
    }

    .badge.prescrito {
      background: #D5DBDB;
      color: #566573;
    }

    .badge.ok {
      background: #D5F4E6;
      color: #27AE60;
    }

    .config-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .sub-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      border-bottom: 1px solid #ddd;
    }

    .sub-tab-button {
      padding: 10px 15px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: #666;
      transition: all 0.3s ease;
    }

    .sub-tab-button.active {
      color: #1B3A5C;
      border-bottom-color: #C8A96E;
    }

    .sub-tab-content {
      display: none;
    }

    .sub-tab-content.active {
      display: block;
    }

    .info-text {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .text-right {
      text-align: right;
    }

    .text-center {
      text-align: center;
    }

    @media (max-width: 1024px) {
      .kpi-grid {
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      }
    }

    /* ── Modais (Link Mágico, Desbloqueio, Seletor de Caso) ───────────── */
    .lm-overlay {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.78);
      z-index: 9998; display: flex; align-items: center; justify-content: center;
      padding: 20px; backdrop-filter: blur(4px);
    }
    .lm-dialog {
      background: white; border-radius: 12px; max-width: 560px; width: 100%;
      max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      animation: lmFade 0.2s ease-out;
    }
    @keyframes lmFade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .lm-dialog .lm-header {
      background: linear-gradient(135deg, #1B3A5C 0%, #2C5282 100%); color: white;
      padding: 20px 24px; border-radius: 12px 12px 0 0;
    }
    .lm-dialog .lm-header h2 { margin: 0 0 4px 0; font-size: 20px; font-weight: 700; }
    .lm-dialog .lm-header p { margin: 0; font-size: 13px; opacity: 0.9; }
    .lm-dialog .lm-body { padding: 24px; }
    .lm-dialog .lm-field { margin-bottom: 14px; }
    .lm-dialog .lm-field label { display: block; font-size: 13px; font-weight: 600; color: #1B3A5C; margin-bottom: 4px; }
    .lm-dialog .lm-field input {
      width: 100%; padding: 10px 12px; border: 1px solid #CBD5E1; border-radius: 6px;
      font-size: 15px; box-sizing: border-box; font-family: inherit;
    }
    .lm-dialog .lm-field input:focus { outline: none; border-color: #1B3A5C; box-shadow: 0 0 0 3px rgba(27,58,92,0.15); }
    .lm-dialog .lm-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
    .lm-dialog .lm-btn {
      padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px;
    }
    .lm-dialog .lm-btn.primary { background: #1B3A5C; color: white; }
    .lm-dialog .lm-btn.primary:hover { background: #2C5282; }
    .lm-dialog .lm-btn.secondary { background: #E2E8F0; color: #1B3A5C; }
    .lm-dialog .lm-btn.secondary:hover { background: #CBD5E1; }
    .lm-dialog .lm-btn.gold { background: #C8A96E; color: #1B3A5C; }
    .lm-dialog .lm-btn.gold:hover { background: #B89559; }
    .lm-dialog .lm-btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .lm-dialog .lm-error { color: #B91C1C; font-size: 13px; margin-top: 8px; background: #FEE2E2; padding: 8px 12px; border-radius: 6px; }
    .lm-dialog .lm-ok    { color: #065F46; font-size: 13px; margin-top: 8px; background: #D1FAE5; padding: 8px 12px; border-radius: 6px; }
    .lm-dialog .lm-note  { color: #475569; font-size: 13px; line-height: 1.5; background: #F1F5F9; padding: 10px 12px; border-radius: 6px; margin-bottom: 14px; }
    .lm-dialog .lm-link-output {
      background: #F8FAFC; border: 1px solid #CBD5E1; border-radius: 6px; padding: 10px;
      font-family: 'Courier New', monospace; font-size: 11px; word-break: break-all; margin-top: 8px; max-height: 120px; overflow-y: auto;
    }
    .lm-caso-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; border: 1px solid #E2E8F0; border-radius: 8px; margin-bottom: 8px;
      background: white; transition: all 0.15s;
    }
    .lm-caso-item:hover { border-color: #1B3A5C; background: #F8FAFC; }
    .lm-caso-item .nome { font-weight: 600; color: #1B3A5C; }
    .lm-caso-item .meta { font-size: 11px; color: #64748B; }

    /* Elementos só visíveis na impressão */
    .print-only { display: none; }

    /* Ajustes para impressão (Dashboard e Relatório por Segurado) */
    @media print {
      body { background: white !important; color: #000 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      header, .tabs, .sub-tabs, .no-print { display: none !important; }
      button { display: none !important; }
      .tab-content { display: block !important; animation: none !important; }
      /* .section NÃO tem page-break-inside para permitir fluxo natural (evita quebra prematura entre Parâmetros e Demonstrativo) */
      .section {
        box-shadow: none !important;
        border: 1px solid #ccc !important;
        margin-bottom: 10px;
      }
      /* KPI cards e grid permanecem inquebráveis */
      .kpi-card {
        box-shadow: none !important;
        border: 1px solid #ccc !important;
        break-inside: avoid;
        page-break-inside: avoid;
        margin-bottom: 10px;
      }
      .kpi-grid { page-break-inside: avoid; break-inside: avoid; }
      /* Linhas da tabela do demonstrativo não devem quebrar no meio */
      table.table tr { page-break-inside: avoid; break-inside: avoid; }
      table.table thead { display: table-header-group; }
      .print-only { display: block !important; }
      .print-header {
        text-align: center;
        margin-bottom: 18px;
        border-bottom: 2px solid #1B3A5C;
        padding-bottom: 8px;
      }
      .print-header h1 { color: #1B3A5C; font-size: 20px; margin-bottom: 4px; }
      .print-header p { font-size: 11px; color: #555; margin: 0; }
      table.table { font-size: 10.5px; }
      table.table th, table.table td { padding: 5px 6px; }
      .container { max-width: 100%; margin: 0; padding: 0; }
      .kpi-icon { display: none; }
      .kpi-value { font-size: 18px !important; }
      .kpi-label { font-size: 11px; }
      .kpi-grid { grid-template-columns: repeat(5, 1fr) !important; gap: 6px; }
      .page-break { page-break-after: always; }
      /* Numeração de páginas no rodapé (Chromium/Edge/Firefox) */
      @page {
        margin: 1.5cm 1.5cm 2cm 1.5cm;
        size: A4;
        @bottom-right {
          content: "Página " counter(page) " de " counter(pages);
          font-family: 'Segoe UI', Arial, sans-serif;
          font-size: 10px;
          color: #555;
        }
        @bottom-left {
          content: "Scozziero Advocacia · Revisão de Mensalidade de Plano de Saúde";
          font-family: 'Segoe UI', Arial, sans-serif;
          font-size: 10px;
          color: #555;
        }
      }
      /* Capa institucional — fundo claro com acentos azul e dourado para economizar tinta sem perder identidade */
      .capa-caso {
        background: #FAFBFC !important;
        color: #1B3A5C !important;
        box-shadow: none !important;
        border: 1px solid #CBD5E1 !important;
        border-top: 3px solid #1B3A5C !important;
        border-left: 6px solid #C8A96E !important;
        page-break-inside: avoid;
        break-inside: avoid;
      }
      .capa-caso h2, .capa-caso .capa-item .valor { color: #1B3A5C !important; }
      .capa-caso .capa-sub, .capa-caso .capa-item .valor.destaque, .capa-caso .capa-escritorio strong { color: #8B6914 !important; }
      .capa-caso .capa-item .rotulo { color: #475569 !important; }
      .capa-caso .capa-topo { border-bottom-color: #CBD5E1 !important; }
    }
  </style>
</head>

            beneficiario: String(nome).trim(),
            mesAno: mesAno,
            valorAnterior: valorAnterior,
            valorNovo: b,
            sugestaoPct: pctSug
          });
          observacao = 'Reajuste vazio na planilha; sugestão calculada: ' + pctSug.toFixed(4) + '%';
        }
      }
      reajustes.push({
        id: baseId * 1000 + idx * 100000 + ridx,
        beneficiarioId: String(benId),
        mesAno: mesAno,
        valorPago: String(b),
        reajusteAplicado: _toPct(c),
        reajusteNegativo: _toPct(e),
        mudancaIdade:     _toPct(f),
        observacao: observacao
      });
      valorAnterior = b;
    }
    abasLidas.push(sheetName + ' → ' + String(nome).trim() + ' (' + ridx + ' parcelas)');
  }

  if (beneficiarios.length === 0) {
    throw new Error('Nenhum segurado encontrado na planilha. Verifique se o nome está preenchido em C2 de alguma aba Segurado1-7.');
  }

  return {
    _info: { abasLidas: abasLidas, abasPuladas: abasPuladas, reajustesSuspeitos: reajustesSuspeitos },
    metadados: {
      nome: nomeCaso || 'Import_XLSX_' + new Date().toISOString().slice(0,19).replace(/[:T]/g,'-'),
      salvoEm: new Date().toISOString(),
      versao: '1.0',
      origem: 'Importação automática de planilha XLSX padrão do escritório'
    },
    cnpjs: [{
      id: cnpjId,
      cnpj: '',
      empresa: '',
      operadora: operadora,
      nrContrato: nrContrato
    }],
    beneficiarios: beneficiarios,
    reajustes: reajustes,
    config: {
      indexador: configIndexador,
      juros: 'hybrid',
      refMes: 'baseplanilha',
      dataFim: configDataFim || '2026-02',
      dataInicio: configDataInicio || '',
      mesReajuste: configMesReajuste
    }
  };
}
// ────────────────────────────────────────────────────────────────────────────

function CalculadoraSaude() {
  // ── Migração one-shot: chave antiga cnjps → cnpjs ─────────────────────────
  try {
    const legacy = localStorage.getItem('calc_cnjps');
    if (legacy !== null && localStorage.getItem('calc_cnpjs') === null) {
      localStorage.setItem('calc_cnpjs', legacy);

    }
  } catch(e) {}

  // ── Helper: lê do localStorage com fallback ───────────────────────────────
  function ls(key, fallback) {
    try { const v = localStorage.getItem('calc_' + key); return v !== null ? JSON.parse(v) : fallback; } catch(e) { return fallback; }
  }

  const [activeTab, setActiveTab] = React.useState(() => ls('activeTab', 'dashboard'));
  const [cnpjs, setCnpjs] = React.useState(() => ls('cnpjs', []));

  const [formCnpj, setFormCnpj] = React.useState({ cnpj: '', empresa: '', operadora: '', nrContrato: '' });
  const [formBeneficiario, setFormBeneficiario] = React.useState({ cnpjId: '', nome: '', cpf: '', dataNascimento: '', dataAdesao: '', numeroCarteirinha: '' });
  const [formReajuste, setFormReajuste] = React.useState({ beneficiarioId: '', mesAno: '', valorPago: '', reajusteAplicado: '', reajusteNegativo: '', mudancaIdade: '', observacao: '' });
  // IDs em edição — null = modo "adicionar"; id definido = modo "atualizar"
  const [editandoCnpjId, setEditandoCnpjId] = React.useState(null);
  const [editandoBeneficiarioId, setEditandoBeneficiarioId] = React.useState(null);
  const [editandoReajusteId, setEditandoReajusteId] = React.useState(null);
  const [configIndexador, setConfigIndexador] = React.useState(() => ls('configIndexador', 'ca'));
  const [configJuros, setConfigJuros] = React.useState(() => ls('configJuros', 'hybrid'));
  const [configRefMes, setConfigRefMes] = React.useState(() => ls('configRefMes', 'baseplanilha'));
  const [configDataFim, setConfigDataFim] = React.useState(() => ls('configDataFim', '2026-02'));
  const [configDataInicio, setConfigDataInicio] = React.useState(() => ls('configDataInicio', '2000-01-01'));
  const [configMesReajuste, setConfigMesReajuste] = React.useState(() => ls('configMesReajuste', 12));
  const [configCnpjFilter, setConfigCnpjFilter] = React.useState('');
  const [resultadosTab, setResultadosTab] = React.useState('segurado');
  const [relatorioBenId, setRelatorioBenId] = React.useState('');

  // ── Salva automaticamente no localStorage a cada alteração ────────────────
  React.useEffect(() => { try { localStorage.setItem('calc_activeTab', JSON.stringify(activeTab)); } catch(e) {} }, [activeTab]);
  React.useEffect(() => { try { localStorage.setItem('calc_cnpjs', JSON.stringify(cnpjs)); } catch(e) {} }, [cnpjs]);
  React.useEffect(() => { try { localStorage.setItem('calc_beneficiarios', JSON.stringify(beneficiarios)); } catch(e) {} }, [beneficiarios]);
  React.useEffect(() => { try { localStorage.setItem('calc_reajustes', JSON.stringify(reajustes)); } catch(e) {} }, [reajustes]);
  React.useEffect(() => { try { localStorage.setItem('calc_configIndexador', JSON.stringify(configIndexador)); } catch(e) {} }, [configIndexador]);
  React.useEffect(() => { try { localStorage.setItem('calc_configJuros', JSON.stringify(configJuros)); } catch(e) {} }, [configJuros]);
  React.useEffect(() => { try { localStorage.setItem('calc_configRefMes', JSON.stringify(configRefMes)); } catch(e) {} }, [configRefMes]);
  React.useEffect(() => { try { localStorage.setItem('calc_configDataFim', JSON.stringify(configDataFim)); } catch(e) {} }, [configDataFim]);
  React.useEffect(() => { try { localStorage.setItem('calc_configDataInicio', JSON.stringify(configDataInicio)); } catch(e) {} }, [configDataInicio]);
  React.useEffect(() => { try { localStorage.setItem('calc_configMesReajuste', JSON.stringify(configMesReajuste)); } catch(e) {} }, [configMesReajuste]);

  // GitHub integration state
  // Auto-avança mês: quando troca o beneficiário, pré-preenche o mês seguinte ao último lançado.
  // Não dispara em modo edição (senão sobrescreve o mês do reajuste carregado para editar).
  React.useEffect(() => {
    if (editandoReajusteId !== null) return;
    const benId = formReajuste.beneficiarioId;
    if (!benId) return;
    const lançamentos = reajustes
      .filter(r => r.beneficiarioId === benId)
      .map(r => r.mesAno)
      .filter(m => /^\d{4}-\d{2}$/.test(m))
      .sort();
    if (lançamentos.length > 0) {
      const proximo = nextMesAno(lançamentos[lançamentos.length - 1]);
      setFormReajuste(prev => ({ ...prev, mesAno: proximo }));
    }
  }, [formReajuste.beneficiarioId, editandoReajusteId]);

  // ── Índices editáveis (sobrepõem os hardcoded INDICES e ANS_ANO) ─────────
  const [indicesCustomMensais, setIndicesCustomMensais] = React.useState(() => ls('indicesCustomMensais', {}));
  const [indicesCustomAns, setIndicesCustomAns] = React.useState(() => ls('indicesCustomAns', {}));
  React.useEffect(() => { try { localStorage.setItem('calc_indicesCustomMensais', JSON.stringify(indicesCustomMensais)); } catch(e) {} }, [indicesCustomMensais]);
  React.useEffect(() => { try { localStorage.setItem('calc_indicesCustomAns', JSON.stringify(indicesCustomAns)); } catch(e) {} }, [indicesCustomAns]);

  // Sanitiza um objeto de overrides mensais. Retorna { limpo, removidos, adelgacados }.
  // - removidos: meses descartados por ca/ia/fa/sa fora de [0.3,3] ou an fora de [-0.3,0.5]
  // - adelgacados: meses fora de INDICES com fatores placeholder (ca=ia=fa=sa=1); mantém só `an`
  const sanearMensaisObj = React.useCallback((prev) => {
    const limpo = {};
    let removidos = 0, adelgacados = 0;
    Object.keys(prev || {}).forEach(mes => {
      const d = prev[mes] || {};
      const caOK = (d.ca === undefined) || (typeof d.ca === 'number' && d.ca >= 0.3 && d.ca <= 3.0);
      const iaOK = (d.ia === undefined) || (typeof d.ia === 'number' && d.ia >= 0.3 && d.ia <= 3.0);
      const faOK = (d.fa === undefined) || (typeof d.fa === 'number' && d.fa >= 0.3 && d.fa <= 3.0);
      const saOK = (d.sa === undefined) || (typeof d.sa === 'number' && d.sa >= 0.3 && d.sa <= 3.0);
      const anOK = (d.an === undefined) || (typeof d.an === 'number' && d.an >= -0.3 && d.an <= 0.5);
      if (!(caOK && iaOK && faOK && saOK && anOK)) {
        removidos++;
        try { console.warn('[Saneamento] Removido override corrompido', mes, d); } catch(e) {}
        return;
      }
      const placeholder = (d.ca === 1 && d.ia === 1 && d.fa === 1 && d.sa === 1);
      if (!INDICES[mes] && placeholder) {
        adelgacados++;
        try { console.warn('[Saneamento] Adelgaçado (mantém só ANS)', mes); } catch(e) {}
        if (d.an !== undefined) limpo[mes] = { an: d.an };
        return;
      }
      limpo[mes] = d;
    });
    return { limpo, removidos, adelgacados };
  }, []);

  // Sanitização one-shot no boot — limpa o estado inicial (vindo do localStorage)
  const sanitizacaoFeitaRef = React.useRef(false);
  React.useEffect(() => {
    if (sanitizacaoFeitaRef.current) return;
    sanitizacaoFeitaRef.current = true;
    setIndicesCustomMensais(prev => {
      const { limpo, removidos, adelgacados } = sanearMensaisObj(prev);
      if (removidos > 0 || adelgacados > 0) {
        try { setTimeout(() => { alert(`⚠️ Saneamento de índices: ${removidos} mês(es) corrompido(s) restaurado(s) ao padrão; ${adelgacados} mês(es) com fatores placeholder limpo(s).`); }, 500); } catch(e) {}
      }
      return (removidos === 0 && adelgacados === 0) ? prev : limpo;
    });
  }, [sanearMensaisObj]);
  const INDICES_MERGED = React.useMemo(() => ({ ...INDICES, ...indicesCustomMensais }), [indicesCustomMensais]);
  const ANS_ANO_MERGED = React.useMemo(() => ({ ...ANS_ANO, ...indicesCustomAns }), [indicesCustomAns]);

  // Form state para edição de índices
  const [formAnsAno, setFormAnsAno] = React.useState('');
  const [formAnsPct, setFormAnsPct] = React.useState('');
  const [formMensalMesAno, setFormMensalMesAno] = React.useState('');
  const [formMensalIa, setFormMensalIa] = React.useState('');
  const [formMensalAn, setFormMensalAn] = React.useState('');
  const [formMensalCa, setFormMensalCa] = React.useState('');
  const [formMensalFa, setFormMensalFa] = React.useState('');
  const [formMensalSa, setFormMensalSa] = React.useState('');
  const [filtroAnoMensal, setFiltroAnoMensal] = React.useState('');

  // Edição inline de índices mensais (exibe/edita valores mensais em %)
  const [editandoIndiceMes, setEditandoIndiceMes] = React.useState(null);
  const [editIndicePctIpca, setEditIndicePctIpca] = React.useState('');
  const [editIndicePctInpc, setEditIndicePctInpc] = React.useState('');
  const [editIndicePctFipe, setEditIndicePctFipe] = React.useState('');
  const [editIndicePctSelic, setEditIndicePctSelic] = React.useState('');
  const [editIndicePctAns, setEditIndicePctAns] = React.useState('');

  const GH_OWNER = 'gnscozziero-lang';
  const GH_REPO = 'calculadora-plano-saude';
  const [ghToken, setGhToken] = React.useState(() => ls('ghToken', ''));
  const [ghStatus, setGhStatus] = React.useState('');
  const [ghSaving, setGhSaving] = React.useState(false);
  const [ghLoading, setGhLoading] = React.useState(false);
  const [ghCasoNome, setGhCasoNome] = React.useState(() => ls('ghCasoNome', ''));
  React.useEffect(() => { try { localStorage.setItem('calc_ghToken', JSON.stringify(ghToken)); } catch(e) {} }, [ghToken]);
  React.useEffect(() => { try { localStorage.setItem('calc_ghCasoNome', JSON.stringify(ghCasoNome)); } catch(e) {} }, [ghCasoNome]);
  const [ghCasos, setGhCasos] = React.useState([]);
  const [ghHistorico, setGhHistorico] = React.useState(null);

  // ── Link Mágico + Seletor de Caso (multi-dispositivo) ────────────────────
  const [bootModal, setBootModal] = React.useState(null); // 'unlock' | 'select' | 'setup' | null
  const [bootError, setBootError] = React.useState('');
  const [unlockPin, setUnlockPin] = React.useState('');
  const [unlockBusy, setUnlockBusy] = React.useState(false);
  const [linkGenOpen, setLinkGenOpen] = React.useState(false);
  const [linkPin1, setLinkPin1] = React.useState('');
  const [linkPin2, setLinkPin2] = React.useState('');
  const [linkGenResult, setLinkGenResult] = React.useState('');
  const [linkGenError, setLinkGenError] = React.useState('');
  const [linkCopyStatus, setLinkCopyStatus] = React.useState('');
  const bootRanRef = React.useRef(false);

  // GitHub helper functions
  const toBase64 = (str) => btoa(unescape(encodeURIComponent(str)));
  const ghHdrs = () => ({ 'Authorization': `token ${ghToken}`, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github.v3+json' });

  const ghListCasos = async () => {
    if (!ghToken) { setGhStatus('❌ Informe o token GitHub primeiro'); return; }
    setGhLoading(true); setGhStatus('🔍 Buscando casos...');
    try {
      const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/casos`, { headers: ghHdrs() });
      if (res.status === 404) { setGhCasos([]); setGhStatus('📂 Nenhum caso salvo ainda'); }
      else if (res.ok) {
        const files = await res.json();
        const arr = Array.isArray(files) ? files.filter(f => f.name.endsWith('.json')) : [];
        setGhCasos(arr);
        setGhStatus(`✅ ${arr.length} caso(s) encontrado(s)`);
      } else { const e = await res.json(); setGhStatus(`❌ ${e.message}`); }
    } catch(e) { setGhStatus(`❌ Erro de rede: ${e.message}`); }
    setGhLoading(false);
  };

  const ghSalvar = async () => {
    if (!ghToken) { setGhStatus('❌ Informe o token GitHub'); return; }
    if (!ghCasoNome.trim()) { setGhStatus('❌ Informe um nome para o caso'); return; }
    setGhSaving(true); setGhStatus('💾 Salvando...');
    const nome = ghCasoNome.trim().replace(/[^\w\s\-]/g, '').replace(/\s+/g, '_');
    const path = `casos/${nome}.json`;
    const payload = {
      metadados: { nome: ghCasoNome.trim(), salvoEm: new Date().toISOString(), versao: '1.0' },
      cnpjs, beneficiarios, reajustes,
      config: { indexador: configIndexador, juros: configJuros, refMes: configRefMes, dataFim: configDataFim, dataInicio: configDataInicio, mesReajuste: configMesReajuste }
    };
    try {
      const checkRes = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${path}`, { headers: ghHdrs() });
      const body = { message: `Salvo: ${ghCasoNome} — ${new Date().toLocaleString('pt-BR')}`, content: toBase64(JSON.stringify(payload, null, 2)) };
      if (checkRes.ok) { const ex = await checkRes.json(); body.sha = ex.sha; }
      const saveRes = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${path}`, { method: 'PUT', headers: ghHdrs(), body: JSON.stringify(body) });
      if (saveRes.ok) { setGhStatus(`✅ Salvo com sucesso: "${ghCasoNome}"`); ghListCasos(); }
      else { const e = await saveRes.json(); setGhStatus(`❌ Erro ao salvar: ${e.message}`); }
    } catch(e) { setGhStatus(`❌ ${e.message}`); }
    setGhSaving(false);
  };

  const ghCarregar = async (file) => {
    if (!window.confirm(`Carregar o caso "${file.name.replace('.json','')}"? Os dados atuais serão substituídos.`)) return;
    setGhLoading(true); setGhStatus(`📂 Carregando...`);
    try {
      const res = await fetch(file.download_url + '?t=' + Date.now());
      if (res.ok) {
        const data = await res.json();
        setCnpjs(data.cnpjs || []); setBeneficiarios(data.beneficiarios || []); setReajustes(data.reajustes || []);
        if (data.config) { setConfigIndexador(data.config.indexador||'ca'); setConfigJuros(data.config.juros||'hybrid'); setConfigRefMes(data.config.refMes||'baseplanilha'); setConfigDataFim(data.config.dataFim||'2026-02'); setConfigDataInicio(data.config.dataInicio||'2000-01-01'); setConfigMesReajuste(data.config.mesReajuste || 12); }
        setGhCasoNome(data.metadados?.nome || file.name.replace('.json',''));
        setGhStatus(`✅ Caso carregado: "${data.metadados?.nome || file.name}"`);
        setActiveTab('dashboard');
      } else { setGhStatus('❌ Erro ao carregar o arquivo'); }
    } catch(e) { setGhStatus(`❌ ${e.message}`); }
    setGhLoading(false);
  };

  const ghRenomear = async (file) => {
    const nomeAtualExibido = file.name.replace('.json','').replace(/_/g,' ');
    const nomeAtualSafe = file.name.replace('.json','');
    const entrada = window.prompt(`Renomear caso "${nomeAtualExibido}" para:`, nomeAtualExibido);
    if (entrada === null) return;
    const novoNome = entrada.trim();
    if (!novoNome) { setGhStatus('❌ Nome do caso não pode ficar vazio'); return; }
    if (novoNome === nomeAtualExibido) { setGhStatus('⚠️ O nome não foi alterado'); return; }
    const novoSafe = novoNome.replace(/[^\w\s\-]/g, '').replace(/\s+/g, '_');
    if (!novoSafe) { setGhStatus('❌ O nome informado ficou vazio após sanitização (remova caracteres especiais)'); return; }
    if (novoSafe === nomeAtualSafe) { setGhStatus('⚠️ O nome normalizado é igual ao atual'); return; }
    const colisao = ghCasos.find(c => c.name === `${novoSafe}.json` && c.sha !== file.sha);
    if (colisao) { setGhStatus(`❌ Já existe um caso salvo com o nome "${novoNome}"`); return; }
    if (!window.confirm(`Renomear "${nomeAtualExibido}" → "${novoNome}"?\n\nO arquivo antigo será removido do repositório. O histórico de versões do arquivo antigo permanece acessível via GitHub, mas não será mais listado aqui.`)) return;
    if (autoSaveTimer.current) clearTimeout(autoSaveTimer.current);
    setGhLoading(true); setGhStatus('✏️ Renomeando...');
    const novoPath = `casos/${novoSafe}.json`;
    try {
      const resGet = await fetch(file.download_url + '?t=' + Date.now());
      if (!resGet.ok) throw new Error('Falha ao baixar o caso atual');
      const data = await resGet.json();
      if (data.metadados) data.metadados.nome = novoNome;
      else data.metadados = { nome: novoNome, salvoEm: new Date().toISOString(), versao: '1.0' };
      const bodyCreate = { message: `Renomeado: "${nomeAtualExibido}" → "${novoNome}"`, content: toBase64(JSON.stringify(data, null, 2)) };
      const createRes = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${novoPath}`, { method: 'PUT', headers: ghHdrs(), body: JSON.stringify(bodyCreate) });
      if (!createRes.ok) { const e = await createRes.json(); throw new Error(`Falha ao criar novo arquivo: ${e.message}`); }
      const bodyDel = { message: `Remove arquivo antigo após renomear para "${novoNome}"`, sha: file.sha };
      const delRes = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${file.path}`, { method: 'DELETE', headers: ghHdrs(), body: JSON.stringify(bodyDel) });
      if (!delRes.ok) { const e = await delRes.json(); setGhStatus(`⚠️ Novo caso criado, mas falhou ao excluir o antigo: ${e.message}. Remova manualmente pelo GitHub se quiser.`); ghListCasos(); setGhLoading(false); return; }
      if (ghCasoNome === nomeAtualExibido || ghCasoNome === nomeAtualSafe.replace(/_/g,' ')) setGhCasoNome(novoNome);
      setGhStatus(`✅ Caso renomeado para "${novoNome}"`);
      ghListCasos();
    } catch(e) { setGhStatus(`❌ ${e.message}`); }
    setGhLoading(false);
  };

  const ghVerHistorico = async (filePath) => {
    setGhLoading(true); setGhStatus('🕐 Carregando histórico...');
    try {
      const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/commits?path=${filePath}&per_page=30`, { headers: ghHdrs() });
      if (res.ok) { const commits = await res.json(); setGhHistorico({ path: filePath, commits }); setGhStatus(''); }
      else { setGhStatus('❌ Erro ao buscar histórico'); }
    } catch(e) { setGhStatus(`❌ ${e.message}`); }
    setGhLoading(false);
  };

  // ── CRUD de Índices ────────────────────────────────────────────────────────
  // ANS anual: a alteração propaga automaticamente para os 12 meses correspondentes
  // (mês 05 do ano até mês 04 do ano seguinte, conforme padrão do mercado).
  const propagarAnsParaMensal = React.useCallback((ano, valor, baseMensais) => {
    const novoMensais = { ...baseMensais };
    const mesesAbrangidos = [];
    for (let m = 5; m <= 12; m++) mesesAbrangidos.push(`${ano}-${String(m).padStart(2,'0')}`);
    for (let m = 1; m <= 4; m++) mesesAbrangidos.push(`${parseInt(ano,10)+1}-${String(m).padStart(2,'0')}`);
    mesesAbrangidos.forEach(mesAno => {
      const existeNoBase = INDICES[mesAno] !== undefined;
      if (existeNoBase) {
        const base = INDICES[mesAno];
        novoMensais[mesAno] = { ...base, ...(novoMensais[mesAno] || {}), an: valor };
      } else {
        const existente = novoMensais[mesAno] || {};
        novoMensais[mesAno] = { ...existente, an: valor };
      }
    });
    return novoMensais;
  }, []);

  const addOrUpdateAnsAnual = (ano, percentualStr) => {
    if (!/^\d{4}$/.test(String(ano))) { alert('Ano inválido. Use 4 dígitos.'); return false; }
    const pct = parseFloat(String(percentualStr).replace(',', '.'));
    if (isNaN(pct)) { alert('Percentual inválido.'); return false; }
    const valor = pct / 100;
    setIndicesCustomAns(prev => ({ ...prev, [ano]: valor }));
    setIndicesCustomMensais(prev => propagarAnsParaMensal(ano, valor, prev));
    return true;
  };

  const deleteAnsAnual = (ano) => {
    const ehCustom = Object.prototype.hasOwnProperty.call(indicesCustomAns, ano);
    const ehPadrao = Object.prototype.hasOwnProperty.call(ANS_ANO, ano);
    if (!ehCustom && !ehPadrao) return;
    const msg = ehPadrao && !ehCustom
      ? `Excluir ANS ${ano} (valor padrão da tabela)? Os 12 meses correspondentes ficarão com ANS = 0.`
      : `Restaurar ANS ${ano} ao valor padrão?`;
    if (!window.confirm(msg)) return;
    if (ehCustom) {
      setIndicesCustomAns(prev => { const n = { ...prev }; delete n[ano]; return n; });
      // Ao remover custom, re-propaga o padrão (se existir) para os 12 meses
      const valorPadrao = ANS_ANO[ano] ?? 0;
      setIndicesCustomMensais(prev => {
        const limpo = { ...prev };
        // Remove override monthly que veio da propagação do custom
        const mesesAbrangidos = [];
        for (let m = 5; m <= 12; m++) mesesAbrangidos.push(`${ano}-${String(m).padStart(2,'0')}`);
        for (let m = 1; m <= 4; m++) mesesAbrangidos.push(`${parseInt(ano,10)+1}-${String(m).padStart(2,'0')}`);
        mesesAbrangidos.forEach(mesAno => {
          // Se o mensal custom SÓ tem override de 'an', remove inteiro (volta ao padrão)
          // Se tem outros campos, mantém outros e restaura 'an' do padrão
          if (limpo[mesAno]) {
            const { an, ...resto } = limpo[mesAno];
            const basePadrao = INDICES[mesAno];
            const temOutrasMudancas = basePadrao && Object.keys(resto).some(k => resto[k] !== basePadrao[k]);
            if (!temOutrasMudancas) { delete limpo[mesAno]; }
            else { limpo[mesAno] = resto; }
          }
        });
        return limpo;
      });
    } else {
      // Excluir valor padrão: grava um override zerado no custom
      setIndicesCustomAns(prev => ({ ...prev, [ano]: 0 }));
      setIndicesCustomMensais(prev => propagarAnsParaMensal(ano, 0, prev));
    }
  };

  const addOrUpdateIndiceMensal = (mesAno, campos) => {
    if (!/^\d{4}-\d{2}$/.test(mesAno)) { alert('Mês-Ano inválido. Use formato AAAA-MM.'); return false; }
    const mm = parseInt(mesAno.slice(5), 10);
    if (mm < 1 || mm > 12) { alert('Mês inválido.'); return false; }
    const baseExistente = INDICES[mesAno] || indicesCustomMensais[mesAno] || { ia: 1, an: 0, ca: 1, fa: 1, sa: 1 };
    const novo = { ...baseExistente };
    ['ia','an','ca','fa','sa'].forEach(k => {
      if (campos[k] !== undefined && campos[k] !== '' && campos[k] !== null) {
        const v = parseFloat(String(campos[k]).replace(',', '.'));
        if (!isNaN(v)) novo[k] = v;
      }
    });
    setIndicesCustomMensais(prev => ({ ...prev, [mesAno]: novo }));
    return true;
  };

  const deleteIndiceMensal = (mesAno) => {
    const ehCustom = Object.prototype.hasOwnProperty.call(indicesCustomMensais, mesAno);
    if (!ehCustom) {
      if (!window.confirm(`Excluir mês ${mesAno} da tabela padrão? Um override zerado será criado.`)) return;
      setIndicesCustomMensais(prev => ({ ...prev, [mesAno]: { ia: 1, an: 0, ca: 1, fa: 1, sa: 1 } }));
      return;
    }
    const existeNoBase = INDICES[mesAno] !== undefined;
    const msg = existeNoBase
      ? `Restaurar ${mesAno} ao valor padrão?`
      : `⚠️ ${mesAno} não existe no dataset padrão (que vai até 2026-02). Restaurar vai REMOVER esse mês da tabela. Continuar?`;
    if (!window.confirm(msg)) return;
    setIndicesCustomMensais(prev => { const n = { ...prev }; delete n[mesAno]; return n; });
  };

  // ── Conversão acumulado ↔ mensal ──────────────────────────────────────────
  const calcMensalFrac = (mesAno, field) => {
    const chaves = Object.keys(INDICES_MERGED).sort();
    const idx = chaves.indexOf(mesAno);
    if (idx <= 0) return null;
    const prev = INDICES_MERGED[chaves[idx - 1]];
    const cur = INDICES_MERGED[mesAno];
    if (!prev || !cur) return null;
    const pv = prev[field];
    const cv = cur[field];
    if (!pv || !cv || cv === 0) return null;
    return (pv / cv) - 1;
  };

  // Aplica edição monthly-pct com propagação forward (semântica b).
  const aplicarEdicaoMensalPct = (mesAno, pcts) => {
    if (!/^\d{4}-\d{2}$/.test(mesAno)) { alert('Mês-Ano inválido.'); return false; }
    const chaves = Object.keys(INDICES_MERGED).sort();
    const idx = chaves.indexOf(mesAno);
    if (idx < 0) { alert('Mês não existe no dataset.'); return false; }

    const limites = { ipca: 0.05, inpc: 0.05, fipe: 0.05, selic: 0.05 };
    const fora = [];
    ['ipca','inpc','fipe','selic'].forEach(k => {
      const v = pcts[k];
      if (v === null || v === undefined || isNaN(v)) return;
      if (v < -0.03 || v > limites[k]) fora.push(`${k.toUpperCase()}: ${(v*100).toFixed(4)}%`);
    });
    if (pcts.ans !== null && pcts.ans !== undefined && !isNaN(pcts.ans)) {
      if (pcts.ans < -0.20 || pcts.ans > 0.50) fora.push(`ANS: ${(pcts.ans*100).toFixed(4)}%`);
    }
    if (fora.length > 0) {
      if (!window.confirm(`Os seguintes valores estão fora da faixa usual:\n\n${fora.join('\n')}\n\nConfirmar mesmo assim?`)) return false;
    }

    const mapFieldFromKey = { ipca: 'ca', inpc: 'ia', fipe: 'fa', selic: 'sa' };

    setIndicesCustomMensais(prev => {
      const novo = { ...prev };
      const merged = { ...INDICES, ...prev };

      ['ipca','inpc','fipe','selic'].forEach(k => {
        const frac = pcts[k];
        if (frac === null || frac === undefined || isNaN(frac)) return;
        const field = mapFieldFromKey[k];
        const prevMes = merged[chaves[idx - 1]];
        if (!prevMes || !prevMes[field]) { try { console.warn('[Índices] Sem mês anterior para', k, 'em', mesAno); } catch(e) {} return; }
        const novoAcum = prevMes[field] / (1 + frac);
        const atualAcum = (merged[mesAno] && merged[mesAno][field]) ? merged[mesAno][field] : novoAcum;
        if (!atualAcum || atualAcum === 0) return;
        const fator = novoAcum / atualAcum;
        for (let i = idx; i < chaves.length; i++) {
          const mi = chaves[i];
          const baseMi = novo[mi] || { ...(INDICES[mi] || {}) };
          const valorAtual = (baseMi[field] !== undefined ? baseMi[field] : (INDICES[mi] && INDICES[mi][field]));
          if (valorAtual === undefined || valorAtual === null) continue;
          baseMi[field] = valorAtual * fator;
          novo[mi] = baseMi;
        }
      });

      if (pcts.ans !== null && pcts.ans !== undefined && !isNaN(pcts.ans)) {
        const baseMi = novo[mesAno] || { ...(INDICES[mesAno] || {}) };
        baseMi.an = pcts.ans;
        novo[mesAno] = baseMi;
      }

      return novo;
    });
    return true;
  };

  const iniciarEdicaoIndiceMes = (mesAno) => {
    const fmtPctLocal = (f) => f === null ? '' : (f * 100).toFixed(4).replace('.', ',');
    setEditandoIndiceMes(mesAno);
    setEditIndicePctIpca(fmtPctLocal(calcMensalFrac(mesAno, 'ca')));
    setEditIndicePctInpc(fmtPctLocal(calcMensalFrac(mesAno, 'ia')));
    setEditIndicePctFipe(fmtPctLocal(calcMensalFrac(mesAno, 'fa')));
    setEditIndicePctSelic(fmtPctLocal(calcMensalFrac(mesAno, 'sa')));
    const dados = INDICES_MERGED[mesAno] || {};
    setEditIndicePctAns(dados.an !== undefined ? ((dados.an || 0) * 100).toFixed(4).replace('.', ',') : '');
  };
  const cancelarEdicaoIndiceMes = () => {
    setEditandoIndiceMes(null);
    setEditIndicePctIpca(''); setEditIndicePctInpc(''); setEditIndicePctFipe(''); setEditIndicePctSelic(''); setEditIndicePctAns('');
  };
  const salvarEdicaoIndiceMes = () => {

    const parsePct = (s) => {
      const t = String(s).trim().replace(',', '.');
      if (t === '') return null;

      if (isNaN(n)) return null;
      return n / 100;

    const pcts = {
      ipca: parsePct(editIndicePctIpca),
      inpc: parsePct(editIndicePctInpc),
      fipe: parsePct(editIndicePctFipe),
      selic: parsePct(editIndicePctSelic),
      ans: parsePct(editIndicePctAns),
    };
    if (aplicarEdicaoMensalPct(editandoIndiceMes, pcts)) {
      cancelarEdicaoIndiceMes();
    }
  };

  // ── GitHub: persistência de índices globais ───────────────────────────────
  const [ghIndicesStatus, setGhIndicesStatus] = React.useState('');

  const ghSaveIndices = React.useCallback(async (token, ansCustom, mensaisCustom) => {

    const payload = {
      metadados: { atualizadoEm: new Date().toISOString(), versao: '1.0' },
      ansAnual: ansCustom,
      mensais: mensaisCustom
    };
    setGhIndicesStatus('☁️ Salvando índices...');
    try {
      const hdrs = { 'Authorization': `token ${token}`, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github.v3+json' };
      const checkRes = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${path}`, { headers: hdrs });
      const body = { message: `Índices atualizados — ${new Date().toLocaleString('pt-BR')}`, content: btoa(unescape(encodeURIComponent(JSON.stringify(payload, null, 2)))) };
      if (checkRes.ok) { const ex = await checkRes.json(); body.sha = ex.sha; }
      const saveRes = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${path}`, { method: 'PUT', headers: hdrs, body: JSON.stringify(body) });
      if (saveRes.ok) { setGhIndicesStatus('✅ Índices salvos ' + new Date().toLocaleTimeString('pt-BR')); }
      else { const e = await saveRes.json(); setGhIndicesStatus('❌ ' + e.message); }
    } catch(e) { setGhIndicesStatus('❌ ' + e.message); }
  }, []);

  const ghLoadIndices = async () => {
    if (!ghToken) { setGhIndicesStatus('❌ Informe o token GitHub primeiro'); return; }
    setGhIndicesLoading(true); setGhIndicesStatus('🔍 Carregando índices...');
    try {
      const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/indices/indices.json`, { headers: ghHdrs() });
      if (res.status === 404) { setGhIndicesStatus('📂 Nenhum índice customizado salvo ainda'); }
      else if (res.ok) {
        const file = await res.json();
        const content = JSON.parse(decodeURIComponent(escape(atob(file.content))));
        const saneIdx = sanearMensaisObj(content.mensais || {});
        setIndicesCustomAns(content.ansAnual || {});
        setIndicesCustomMensais(saneIdx.limpo);
        const extraMsg = (saneIdx.removidos > 0 || saneIdx.adelgacados > 0)
          ? ` · Saneados: ${saneIdx.removidos} corrompido(s), ${saneIdx.adelgacados} placeholder(s)`
          : '';
        setGhIndicesStatus(`✅ Índices carregados (${Object.keys(content.ansAnual || {}).length} ANS custom, ${Object.keys(saneIdx.limpo).length} mensais custom)${extraMsg}`);
        if (saneIdx.removidos > 0 || saneIdx.adelgacados > 0) {
          try { setTimeout(() => alert(`⚠️ Saneamento aplicado ao carregar do GitHub:
• ${saneIdx.removidos} mês(es) corrompido(s) restaurado(s)
• ${saneIdx.adelgacados} mês(es) com fatores placeholder limpo(s).

O próximo auto-save vai gravar a versão limpa no repositório.`), 600); } catch(e) {}
        }
      } else { const e = await res.json(); setGhIndicesStatus(`❌ ${e.message}`); }
    } catch(e) { setGhIndicesStatus(`❌ ${e.message}`); }
    setGhIndicesLoading(false);
  };

  // Boot: carrega índices do GitHub ao iniciar (se token disponível)
  React.useEffect(() => {
    if (!ghToken || indicesLoadedRef.current) return;
    indicesLoadedRef.current = true;
    (async () => {
      try {
        const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/indices/indices.json`, { headers: { 'Authorization': `token ${ghToken}`, 'Accept': 'application/vnd.github.v3+json' } });
        if (res.ok) {
          const file = await res.json();
          const content = JSON.parse(decodeURIComponent(escape(atob(file.content))));
          if (content.ansAnual) setIndicesCustomAns(content.ansAnual);
          if (content.mensais) {
            const saneBoot = sanearMensaisObj(content.mensais);
            setIndicesCustomMensais(saneBoot.limpo);
            if (saneBoot.removidos > 0 || saneBoot.adelgacados > 0) {
              try { setTimeout(() => alert(`⚠️ Saneamento ao carregar índices do GitHub:
• ${saneBoot.removidos} mês(es) corrompido(s)
• ${saneBoot.adelgacados} mês(es) placeholder limpo(s)

O próximo auto-save sobrescreve o repositório com a versão limpa.`), 800); } catch(e) {}
            }
          }
        }
      } catch(e) { /* silencioso no boot */ }
    })();
  }, [ghToken]);

  // Auto-save de índices (debounce 5s) — só dispara após primeira mudança do usuário
  const indicesFirstRender = React.useRef(true);
  React.useEffect(() => {
    if (indicesFirstRender.current) { indicesFirstRender.current = false; return; }
    if (!ghToken) return;
    if (indicesAutoSaveTimer.current) clearTimeout(indicesAutoSaveTimer.current);
    setGhIndicesStatus('⏳ Aguardando...');
    indicesAutoSaveTimer.current = setTimeout(() => {
      ghSaveIndices(ghToken, indicesCustomAns, indicesCustomMensais);
    }, 5000);
    return () => { if (indicesAutoSaveTimer.current) clearTimeout(indicesAutoSaveTimer.current); };
  }, [indicesCustomAns, indicesCustomMensais, ghToken, ghSaveIndices]);

  // ── Auto-save GitHub ──────────────────────────────────────────────────────
  const [autoSaveStatus, setAutoSaveStatus] = React.useState('');
  const autoSaveTimer = React.useRef(null);
  const isFirstRender = React.useRef(true);

  const ghAutoSave = React.useCallback(async (token, nome, data) => {
    if (!token || !nome.trim()) return;
    setAutoSaveStatus('☁️ Salvando...');
    const nomeSafe = nome.trim().replace(/[^\w\s\-]/g, '').replace(/\s+/g, '_');
    const path = `casos/${nomeSafe}.json`;
    try {
      const hdrs = { 'Authorization': `token ${token}`, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github.v3+json' };
      const checkRes = await fetch(`https://api.github.com/repos/gnscozziero-lang/calculadora-plano-saude/contents/${path}`, { headers: hdrs });
      const body = { message: `Auto-save: ${nome} — ${new Date().toLocaleString('pt-BR')}`, content: btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2)))) };
      if (checkRes.ok) { const ex = await checkRes.json(); body.sha = ex.sha; }
      const saveRes = await fetch(`https://api.github.com/repos/gnscozziero-lang/calculadora-plano-saude/contents/${path}`, { method: 'PUT', headers: hdrs, body: JSON.stringify(body) });
      if (saveRes.ok) { setAutoSaveStatus('✅ Salvo ' + new Date().toLocaleTimeString('pt-BR')); }
      else { const e = await saveRes.json(); setAutoSaveStatus('❌ ' + e.message); }
    } catch(e) { setAutoSaveStatus('❌ ' + e.message); }
  }, []);

  React.useEffect(() => {
    if (isFirstRender.current) { isFirstRender.current = false; return; }
    if (!ghToken || !ghCasoNome.trim()) return;
    if (autoSaveTimer.current) clearTimeout(autoSaveTimer.current);
    setAutoSaveStatus('⏳ Aguardando...');
    autoSaveTimer.current = setTimeout(() => {
      const payload = {
        metadados: { nome: ghCasoNome.trim(), salvoEm: new Date().toISOString(), versao: '1.0' },
        cnpjs, beneficiarios, reajustes,
        config: { indexador: configIndexador, juros: configJuros, refMes: configRefMes, dataFim: configDataFim, dataInicio: configDataInicio, mesReajuste: configMesReajuste }
      };
      ghAutoSave(ghToken, ghCasoNome, payload);
    }, 5000);
    return () => { if (autoSaveTimer.current) clearTimeout(autoSaveTimer.current); };
  }, [cnpjs, beneficiarios, reajustes, configIndexador, configJuros, configRefMes, configDataFim, configDataInicio, configMesReajuste]);

  // ── Link Mágico — gerador ────────────────────────────────────────────────
  const gerarLinkMagico = async () => {
    setLinkGenError(''); setLinkCopyStatus(''); setLinkGenResult('');
    if (!ghToken) { setLinkGenError('Configure o token do GitHub antes de gerar o link.'); return; }
    if (!/^\d{4,8}$/.test(linkPin1)) { setLinkGenError('O PIN deve ter de 4 a 8 dígitos numéricos.'); return; }
    if (linkPin1 !== linkPin2) { setLinkGenError('Os PINs não conferem.'); return; }
    try {
      const payload = JSON.stringify({ t: ghToken, o: GH_OWNER, r: GH_REPO });
      const cipher = await encryptWithPin(payload, linkPin1);
      const base = window.location.origin + window.location.pathname;
      const url = `${base}#lm=${cipher}`;
      setLinkGenResult(url);
    } catch(e) { setLinkGenError('Erro ao gerar o link: ' + e.message); }
  };

  const copiarLinkMagico = async () => {

      setLinkCopyStatus('✅ Link copiado para a área de transferência');
    } catch(e) {

  };

  const fecharLinkGen = () => {
    setLinkGenOpen(false); setLinkPin1(''); setLinkPin2(''); setLinkGenResult(''); setLinkGenError(''); setLinkCopyStatus('');

  // ── Link Mágico — desbloqueio via hash ────────────────────────────────────
  const desbloquearLink = async () => {
    setBootError('');
    if (!unlockPin) { setBootError('Informe o PIN.'); return; }
    setUnlockBusy(true);
    try {
      const hash = window.location.hash.replace(/^#/, '');

      const cipher = params.get('lm');
      if (!cipher) throw new Error('Link sem dados cifrados.');
      const payload = await decryptWithPin(cipher, unlockPin);
      const parsed = JSON.parse(payload);
      if (!parsed.t) throw new Error('Conteúdo inválido.');
      setGhToken(parsed.t);

      try { history.replaceState(null, '', window.location.pathname + window.location.search); } catch(e) {}
      setUnlockPin('');

  // Versão de ghListCasos que aceita token explícito (o state pode ainda não ter propagado)

  // ── Importador de planilha XLSX (template padrão do escritório) ──────────
  const [importXlsxStatus, setImportXlsxStatus] = React.useState('');
  const importarXlsx = async (file) => {
    if (!file) return;
    if (typeof XLSX === 'undefined') {
      alert('Biblioteca de leitura XLSX ainda não carregou. Recarregue a página e tente novamente.');
      return;
    }
    const temDados = cnpjs.length > 0 || beneficiarios.length > 0 || reajustes.length > 0;
    if (temDados) {
      if (ghToken && ghCasoNome && ghCasoNome.trim()) {

        try {
          await ghSalvar();
        } catch (err) {
          if (!window.confirm('Falha ao salvar o caso atual (' + (err.message || err) + '). Continuar com a importação mesmo assim? Os dados atuais serão perdidos.')) {

          }
        }
      } else {

          ? 'GitHub não está configurado (sem token).'
          : 'O caso atual não tem nome definido.';
        if (!window.confirm('Há um caso carregado e não foi possível salvar automaticamente: ' + motivo + '\n\nImportar mesmo assim vai SUBSTITUIR os dados atuais. Continuar?')) {
          setImportXlsxStatus('');
          return;
        }
      }
    }
    setImportXlsxStatus('📥 Lendo planilha...');
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array', cellDates: true });
      const nomePadrao = file.name.replace(/\.xlsx$/i, '').replace(/[^\w\s\-]/g, '').replace(/\s+/g, '_') + '_' + new Date().toISOString().slice(0,10);
      const payload = parseXlsxToPayload(wb, nomePadrao);
      setCnpjs(payload.cnpjs || []);
      setBeneficiarios(payload.beneficiarios || []);
      setReajustes(payload.reajustes || []);
      if (payload.config) {
        setConfigIndexador(payload.config.indexador || 'ca');
        setConfigJuros(payload.config.juros || 'hybrid');
        setConfigRefMes(payload.config.refMes || 'baseplanilha');
        setConfigDataFim(payload.config.dataFim || '2026-02');
        setConfigDataInicio(payload.config.dataInicio || '');
        setConfigMesReajuste(payload.config.mesReajuste || 12);
      }
      setGhCasoNome(payload.metadados?.nome || nomePadrao);
      setActiveTab('cadastro');
      const info = payload._info || {};
      const lidas = (info.abasLidas || []).join('\n  • ');
      const puladas = (info.abasPuladas || []).filter(s => s.indexOf('(vazia)') >= 0).join(', ');
      const suspeitos = info.reajustesSuspeitos || [];
      let avisoSuspeitos = '';
      if (suspeitos.length > 0) {
        avisoSuspeitos = '\n⚠️ ATENÇÃO — ' + suspeitos.length + ' mês(es) com reajuste vazio na planilha mas valor mudou (provável cache do Excel).\nVerifique e preencha manualmente na aba Reajustes:\n';
        suspeitos.forEach(function(su) {
          avisoSuspeitos += '  • ' + su.beneficiario + ' ' + su.mesAno + ': ' + su.valorAnterior.toFixed(2) + ' → ' + su.valorNovo.toFixed(2) + ' (sugestão ~' + su.sugestaoPct.toFixed(4) + '%)\n';
        });
      }
      setImportXlsxStatus('');
      alert(
        '✅ Planilha importada com sucesso.\n\n' +
        'Segurados importados:\n  • ' + lidas + '\n\n' +
        (puladas ? 'Abas puladas por estarem vazias: ' + puladas + '\n\n' : '') +
        '⚠️ CNPJ e Empresa NÃO constam na planilha — preencha manualmente na aba Cadastro.\n' +
        '⚠️ CPF, data de nascimento, data de adesão e carteirinha também ficaram em branco.' +

      );
    } catch (err) {
      setImportXlsxStatus('');
      alert('❌ Erro ao importar planilha: ' + (err.message || err));

  };

  // ── useEffect de boot: roda só uma vez ───────────────────────────────────
  React.useEffect(() => {
    if (bootRanRef.current) return;
    bootRanRef.current = true;
    const hash = window.location.hash.replace(/^#/, '');

      setBootModal('select');
      setTimeout(() => { try { ghListCasosComToken(ghToken); } catch(e) {} }, 50);
    }
  }, []);

  // ── CNPJ: adicionar / editar / cancelar / excluir ────────────────────────
  const salvarCnpj = () => {
    if (!formCnpj.cnpj.trim()) return;
    if (editandoCnpjId !== null) {
      setCnpjs(cnpjs.map(c => c.id === editandoCnpjId ? { ...c, ...formCnpj } : c));

  const cancelarEdicaoCnpj = () => {
    setEditandoCnpjId(null);
    setFormCnpj({ cnpj: '', empresa: '', operadora: '', nrContrato: '' });

  const deleteCnpj = (id) => {

  // ── Beneficiário: adicionar / editar / cancelar / excluir ────────────────
  const salvarBeneficiario = () => {

  // ── Reajuste: adicionar / editar / cancelar / excluir ────────────────────
  const salvarReajuste = () => {

    if (editandoReajusteId !== null) {

  const iniciarEdicaoReajuste = (r) => {

  const cancelarEdicaoReajuste = () => {

  };

  const deleteReajuste = (id) => {
    if (editandoReajusteId === id) cancelarEdicaoReajuste();
    setReajustes(reajustes.filter(r => r.id !== id));
  };

  const calcularResultados = React.useMemo(() => {
    return () => {
      let todosPorSeguro = [];
      let todosPorCNPJ = {};

      beneficiarios.forEach(ben => {
        const cnpj = cnpjs.find(c => c.id === parseInt(ben.cnpjId));
        if (!cnpj) return;

        const reajustesBen = reajustes
          .filter(r => r.beneficiarioId === ben.id.toString() && r.mesAno <= configDataFim)
          .sort((a, b) => a.mesAno.localeCompare(b.mesAno));

        let valorAnterior = 0;
        reajustesBen.forEach((rej, idx) => {
          const mesAno = rej.mesAno;
          const valorPago = parseFloat(rej.valorPago) || 0;
          const reajusteAplicado = parseFloat(rej.reajusteAplicado);
          const reajusteNegativo = (parseFloat(rej.reajusteNegativo) || 0) / 100;
          const mudancaIdade = (parseFloat(rej.mudancaIdade) || 0) / 100;

          let valorDevido;
          if (idx === 0) {
            valorDevido = valorPago;
          } else {
            // Reajuste devido (D): ANS do ano SÓ no mês de aniversário do contrato (configMesReajuste).
            // Nos demais meses, D=0. Replica comportamento da planilha do escritório.
            const mesNum = parseInt(mesAno.slice(5), 10);
            const isMesAniversario = mesNum === parseInt(configMesReajuste, 10);
            const ansRate = isMesAniversario ? (INDICES_MERGED[mesAno]?.an || 0) : 0;
            const hasReajuste = rej.reajusteAplicado !== '' && rej.reajusteAplicado != null && !isNaN(reajusteAplicado);
            const applied = hasReajuste ? reajusteAplicado / 100 : null;

            if (applied !== null) {
              if (applied < 0) {
                valorDevido = valorAnterior * (1 + ansRate) * (1 + reajusteNegativo) * (1 + mudancaIdade);
              } else {
                const minAdjust = Math.min(applied, ansRate);
                valorDevido = valorAnterior * (1 + minAdjust) * (1 + reajusteNegativo) * (1 + mudancaIdade);
              }
            } else {
              // No reajuste this month — value carries forward with only age/neg adjustments
              valorDevido = valorAnterior * (1 + reajusteNegativo) * (1 + mudancaIdade);
            }
          }

          const dataInicioCobr = new Date(configDataInicio);
          const mesAnoDate = new Date(mesAno + '-01');
          const diferenca = mesAnoDate >= dataInicioCobr ? Math.max(0, valorPago - valorDevido) : 0;

          const fimDate = new Date(configDataFim + '-01');
          const daysDiff = (fimDate - new Date(mesAno + '-01')) / (1000 * 60 * 60 * 24);
          const years = Math.floor(daysDiff) / 365.25;
          const prescrito = years >= 3;

          // Modo "padrão planilha": quando configRefMes === 'baseplanilha' ou vazio,
          // usa o Fator IPCA/INPC/FIPE/SELIC acumulado DIRETO (sem dividir por refMes).
          // Equivale a uma data-base virtual pós-tabela com acum=1.0. A planilha original
          // do escritório trabalha exatamente assim e foi aceita em juízo.
          const isBasePlanilha = !configRefMes || configRefMes === 'baseplanilha' || !INDICES_MERGED[configRefMes];

          let fatorCorrecao = 1.0;
          if (configIndexador !== 'sem') {
            const correcaoMes = INDICES_MERGED[mesAno]?.[configIndexador];
            if (isBasePlanilha) {
              if (correcaoMes) fatorCorrecao = correcaoMes;
            } else {
              const correcaoRef = INDICES_MERGED[configRefMes]?.[configIndexador];
              if (correcaoRef && correcaoMes) fatorCorrecao = correcaoMes / correcaoRef;
            }
          }

          let jurosPercent = 0;
          if (configJuros !== 'sem') {
            const selicMes = INDICES_MERGED[mesAno]?.sa || 1;
            const selicRef = isBasePlanilha ? 1 : (INDICES_MERGED[configRefMes]?.sa || 1);
            const selicAccum = selicMes / selicRef - 1;

            if (configJuros === 'selic') {
              jurosPercent = Math.max(0, selicAccum);
            } else {
              const AUG_2024 = '2024-08';
              if (mesAno <= AUG_2024) {
                const diffMeses = (new Date(AUG_2024).getFullYear() - new Date(mesAno).getFullYear()) * 12 +
                                  (new Date(AUG_2024).getMonth() - new Date(mesAno).getMonth());
                jurosPercent = 0.01 * (diffMeses + 1) + selicAccum;
              } else {
                jurosPercent = Math.max(0, selicAccum);
              }
            }
          }

          const totalAtualizado = prescrito ? 0 : diferenca * fatorCorrecao * (1 + jurosPercent);

          const row = {
            mesAno,
            valorPago,
            valorDevido: parseFloat(valorDevido.toFixed(2)),
            diferenca: parseFloat(diferenca.toFixed(2)),
            prescrito,
            fatorCorrecao: parseFloat(fatorCorrecao.toFixed(6)),
            jurosPercent,
            totalAtualizado: parseFloat(totalAtualizado.toFixed(2)),
            beneficiario: ben.nome,
            cnpj: cnpj.cnpj,
            cnpjId: cnpj.id
          };

          todosPorSeguro.push(row);
          valorAnterior = valorDevido;

          if (!todosPorCNPJ[cnpj.id]) {
            todosPorCNPJ[cnpj.id] = { cnpj: cnpj.cnpj, empresa: cnpj.empresa, rows: [] };
          }
          todosPorCNPJ[cnpj.id].rows.push(row);
        });
      });

      return { todosPorSeguro, todosPorCNPJ };
    };
  }, [beneficiarios, reajustes, cnpjs, configIndexador, configJuros, configRefMes, configDataFim, configDataInicio, configMesReajuste]);

  const resultados = calcularResultados();

  const metricas = React.useMemo(() => {
    let totalRestituir = 0, excesso = 0, correcao = 0, juros = 0, prescrito = 0;
    resultados.todosPorSeguro.forEach(row => {
      if (!row.prescrito) {
        totalRestituir += row.totalAtualizado;
        excesso += row.diferenca;
        correcao += row.diferenca * (row.fatorCorrecao - 1);
        juros += row.diferenca * row.fatorCorrecao * row.jurosPercent;
      } else {
        prescrito += row.diferenca;
      }
    });
    return { totalRestituir: parseFloat(totalRestituir.toFixed(2)), excesso: parseFloat(excesso.toFixed(2)), correcao: parseFloat(correcao.toFixed(2)), juros: parseFloat(juros.toFixed(2)), prescrito: parseFloat(prescrito.toFixed(2)) };
  }, [resultados]);

  const handleCsvImport = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    Papa.parse(file, {
      header: true,
      skipEmptyLines: true,
      complete: (results) => {
        const novosReajustes = results.data.map(row => ({
          id: Date.now() + Math.random(),
          beneficiarioId: row.beneficiarioId,
          mesAno: row.mesAno,
          valorPago: row.valorPago,
          reajusteAplicado: row.reajusteAplicado,
          reajusteNegativo: row.reajusteNegativo || '',
          mudancaIdade: row.mudancaIdade || '',
          observacao: row.observacao || ''
        }));
        setReajustes([...reajustes, ...novosReajustes]);
      }
    });
  };

  const exportCsv = () => {
    const csv = [['Mês', 'Beneficiário', 'CNPJ', 'Valor Pago', 'Valor Devido', 'Diferença', 'Prescrito', 'Fator Correção', 'Juros %', 'Total Atualizado']];
    resultados.todosPorSeguro.forEach(row => {
      csv.push([row.mesAno, row.beneficiario, row.cnpj, row.valorPago, row.valorDevido, row.diferenca, row.prescrito ? 'Sim' : 'Não', row.fatorCorrecao, (row.jurosPercent * 100).toFixed(2), row.totalAtualizado]);
    });
    const content = csv.map(row => row.map(cell => `"${cell}"`).join(',')).join('\n');
    const link = document.createElement('a');
    link.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(content);
    link.download = 'resultados.csv';
    link.click();
  };

  const filteredResults = configCnpjFilter
    ? resultados.todosPorSeguro.filter(r => r.cnpjId === parseInt(configCnpjFilter))
    : resultados.todosPorSeguro;

  // ── Capa institucional do Caso (cabeçalho grande p/ Dashboard + Relatório Individual) ──
  const dataRelatorioHoje = (() => {
    const d = new Date();
    return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
  })();
  const cnpjContratante = cnpjs[0] || null;
  const renderCapa = (tituloPeca, beneficiarioNome) => (
    <div className="capa-caso">
      <div className="capa-topo">
        <div>
          <h2>{tituloPeca}</h2>
          <div className="capa-sub">Falso Coletivo · Aplicação do Teto ANS (art. 35-E, Lei 9.656/98)</div>
        </div>
        <div className="capa-escritorio">
          <strong>SCOZZIERO ADVOCACIA</strong>
          Saúde Suplementar · Direito do Consumidor<br/>
          Emissão: {dataRelatorioHoje}
        </div>
      </div>
      <div className="capa-grid">
        <div className="capa-item">
          <span className="rotulo">Empresa Contratante</span>
          <span className="valor destaque">{cnpjContratante?.empresa || '—'}</span>
        </div>
        <div className="capa-item">
          <span className="rotulo">CNPJ</span>
          <span className="valor">{cnpjContratante?.cnpj || '—'}</span>
        </div>
        <div className="capa-item">
          <span className="rotulo">Operadora</span>
          <span className="valor">{cnpjContratante?.operadora || '—'}</span>
        </div>
        <div className="capa-item">
          <span className="rotulo">Nº do Contrato / Apólice</span>
          <span className="valor">{cnpjContratante?.nrContrato || '—'}</span>

          <span className="rotulo">Caso</span>
          <span className="valor">{ghCasoNome || '—'}</span>
        </div>
        <div className="capa-item">
          <span className="rotulo">Período Apurado</span>
          <span className="valor">{configDataInicio || '—'} a {fmtMesAno(configDataFim)}</span>
        </div>
        {beneficiarioNome && (
          <div className="capa-item" style={{gridColumn: '1 / -1', borderTop: '1px solid rgba(255,255,255,0.2)', paddingTop: '10px', marginTop: '4px'}}>

            <span className="valor destaque">{beneficiarioNome}</span>
          </div>
        )}

  );

  return (
    <div>
      <header style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'18px 40px'}}>
        <div>
          <h1 style={{marginBottom:'2px'}}>Revisão de Plano de Saúde</h1>
          <p style={{margin:0}}>Scozziero Advocacia — Falso Coletivo (ANS)</p>
        </div>
        <div style={{display:'flex',gap:'10px',alignItems:'center'}}>
          {ghToken && ghCasoNome && autoSaveStatus && (
            <span style={{fontSize:'12px',color:'rgba(255,255,255,0.85)',background:'rgba(0,0,0,0.2)',padding:'4px 10px',borderRadius:'20px',whiteSpace:'nowrap'}}>
              {autoSaveStatus}
            </span>
          )}
          {!ghCasoNome && ghToken && (
            <span style={{fontSize:'12px',color:'#FFD580',background:'rgba(0,0,0,0.2)',padding:'4px 10px',borderRadius:'20px'}}>
              ⚠️ Defina o nome do caso para auto-save
            </span>
          )}
          {ghToken && ghCasoNome && (
            <button onClick={ghSalvar} disabled={ghSaving} style={{background:'#C8A96E',color:'#1B3A5C',border:'none',padding:'8px 18px',borderRadius:'6px',fontWeight:'700',cursor:'pointer',fontSize:'14px'}}>
              {ghSaving ? '⏳ Salvando...' : '💾 Salvar agora'}
            </button>
          )}
          <button onClick={() => {
            if (!window.confirm('Iniciar novo caso? Todos os dados atuais serão apagados.')) return;
            ['cnpjs','beneficiarios','reajustes','configIndexador','configJuros','configRefMes','configDataFim','configDataInicio','configMesReajuste','ghCasoNome','activeTab'].forEach(k => localStorage.removeItem('calc_' + k));
            setCnpjs([]); setBeneficiarios([]); setReajustes([]);
            setConfigIndexador('ca'); setConfigJuros('hybrid'); setConfigRefMes('2026-02'); setConfigDataFim('2026-02'); setConfigDataInicio('2000-01-01');
            setGhCasoNome(''); setActiveTab('cadastro');
          }} style={{background:'rgba(255,255,255,0.1)',color:'white',border:'1px solid rgba(255,255,255,0.3)',padding:'8px 18px',borderRadius:'6px',cursor:'pointer',fontSize:'14px'}}>
            🆕 Novo Caso
          </button>
          <label style={{background:'rgba(255,255,255,0.1)',color:'white',border:'1px solid rgba(255,255,255,0.3)',padding:'8px 18px',borderRadius:'6px',cursor:'pointer',fontSize:'14px',display:'inline-block'}}>
            📥 Importar Caso (JSON)
            <input type="file" accept=".json" style={{display:'none'}} onChange={(e) => {
              const f = e.target.files[0]; if (!f) return;
              if (!window.confirm('Importar o caso deste arquivo? Os dados atuais serão substituídos.')) { e.target.value=''; return; }
              const reader = new FileReader();
              reader.onload = (ev) => {
                try {

                  setCnpjs(data.cnpjs || []);
                  setBeneficiarios(data.beneficiarios || []);
                  setReajustes(data.reajustes || []);
                  if (data.config) {
                    setConfigIndexador(data.config.indexador || 'ca');
                    setConfigJuros(data.config.juros || 'hybrid');
                    setConfigRefMes(data.config.refMes || 'baseplanilha');
                    setConfigDataFim(data.config.dataFim || '2026-02');
                    setConfigDataInicio(data.config.dataInicio || '2000-01-01');
                    setConfigMesReajuste(data.config.mesReajuste || 12);
                  }
                  setGhCasoNome(data.metadados?.nome || f.name.replace('.json',''));
                  setActiveTab('dashboard');
                  alert('Caso importado com sucesso: ' + (data.metadados?.nome || f.name));
                } catch (err) {
                  alert('Erro ao importar JSON: ' + err.message);
                }
                e.target.value = '';
              };
              reader.readAsText(f);
            }} />
          </label>
          <label style={{background:'rgba(200,169,110,0.25)',color:'#FFE8B5',border:'1px solid rgba(200,169,110,0.6)',padding:'8px 18px',borderRadius:'6px',cursor:'pointer',fontSize:'14px',display:'inline-block',fontWeight:'600'}} title="Importa a planilha padrão do escritório (abas Segurado1-7). Se já há caso carregado, será salvo automaticamente no GitHub antes.">
            📊 Importar Planilha (.xlsx)
            <input type="file" accept=".xlsx,.xlsm" style={{display:'none'}} onChange={async (e) => {
              const f = e.target.files[0];

          {ghToken && (

              📁 Trocar Caso
            </button>

          <button onClick={() => setActiveTab('github')} style={{background:'rgba(255,255,255,0.15)',color:'white',border:'1px solid rgba(255,255,255,0.3)',padding:'8px 18px',borderRadius:'6px',cursor:'pointer',fontSize:'14px'}}>
            ☁️ GitHub

              {tab === 'dashboard' ? '📊 Dashboard' : tab === 'cadastro' ? '👥 Cadastro' : tab === 'reajustes' ? '📅 Reajustes' : tab === 'resultados' ? '📋 Resultados' : tab === 'relatorio' ? '📄 Relatório' : tab === 'indices' ? '📈 Índices ANS' : '☁️ GitHub'}
            </button>
          ))}
        </div>

        {activeTab === 'dashboard' && (
          <div className="tab-content active">
